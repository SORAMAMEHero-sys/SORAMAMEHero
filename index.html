<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>勇者そらまめ</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#102033;
  font-family:sans-serif;
  touch-action:none;
}

button{
  font:inherit;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}

/* =========================
   HUD
========================= */

#hud{
  position:fixed;
  z-index:50;
  top:0;
  left:0;
  width:100%;
  height:58px;
  background:#101827;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 12px;
  border-bottom:2px solid #536b8b;
}

#title{
  font-weight:bold;
  font-size:15px;
}

#status{
  display:flex;
  gap:8px;
}

.badge{
  background:#1d2a42;
  border:1px solid #637899;
  border-radius:12px;
  padding:7px 10px;
  font-weight:bold;
}

/* =========================
   WORLD
========================= */

#world{
  position:absolute;
  left:0;
  top:58px;
  width:100%;
  height:calc(100% - 58px);
  overflow:hidden;
  background:#326d32;
}

/* 固定されたフィールド */
#field{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 48%,
      rgba(130,220,90,.35),
      transparent 28%),
    #326d32;
}

/* 道 */
.road{
  position:absolute;
  background:#927044;
  border:3px solid rgba(70,45,25,.25);
}

.road.main{
  left:-10%;
  top:52%;
  width:120%;
  height:180px;
  transform:rotate(-2deg);
}

.road.side{
  left:55%;
  top:50%;
  width:170px;
  height:60%;
}

/* 水 */
.water{
  position:absolute;
  background:#28758c;
  border-top:3px solid rgba(255,255,255,.12);
}

.water.bottom{
  left:0;
  bottom:0;
  width:100%;
  height:110px;
}

/* =========================
   scenery
========================= */

.tree{
  position:absolute;
  width:70px;
  height:70px;
  border-radius:50%;
  background:#245b2b;
  border:8px solid #1b4823;
  box-shadow:inset 0 0 0 5px #397d3c;
}

.tree:after{
  content:"";
  position:absolute;
  width:20px;
  height:30px;
  background:#704b2c;
  left:17px;
  top:58px;
  z-index:-1;
}

.rock{
  position:absolute;
  width:55px;
  height:40px;
  background:#697078;
  border-radius:50% 45% 35% 40%;
  border:4px solid #454b51;
}

.tree.t1{left:7%;top:18%}
.tree.t2{right:8%;top:13%}
.tree.t3{left:15%;bottom:15%}
.tree.t4{right:18%;bottom:21%}

.rock.r1{left:27%;top:29%}
.rock.r2{right:27%;top:36%}
.rock.r3{left:43%;bottom:13%}

/* =========================
   Stage
========================= */

.stage{
  position:absolute;
  z-index:10;
  width:125px;
  min-height:58px;
  padding:10px;
  border-radius:16px;
  background:#48251d;
  border:2px solid #a86448;
  color:white;
  text-align:center;
  font-weight:bold;
  box-shadow:0 5px 15px rgba(0,0,0,.35);
}

.stage small{
  display:block;
  font-size:11px;
  opacity:.75;
  margin-top:3px;
}

#stage1{
  left:67%;
  top:48%;
}

/* =========================
   Player
========================= */

#player{
  position:absolute;
  z-index:20;
  left:50%;
  top:50%;
  width:80px;
  height:90px;
  transform:translate(-50%,-50%);
  text-align:center;
  pointer-events:none;
}

#hero{
  font-size:43px;
  line-height:50px;
}

#name{
  display:inline-block;
  background:#101010;
  color:white;
  padding:3px 9px;
  border-radius:10px;
  font-size:12px;
  font-weight:bold;
}

#marker{
  font-size:22px;
  margin-top:-2px;
}

/* =========================
   message
========================= */

#message{
  position:absolute;
  z-index:30;
  top:8px;
  left:8px;
  right:8px;
  padding:7px;
  border-radius:10px;
  background:rgba(10,45,20,.88);
  color:#d8ffd8;
  text-align:center;
  font-size:12px;
}

/* =========================
   controls
========================= */

#controls{
  position:absolute;
  z-index:40;
  left:15px;
  bottom:18px;
  width:170px;
  height:170px;
}

.ctrl{
  position:absolute;
  width:55px;
  height:55px;
  border-radius:13px;
  border:2px solid #607a9e;
  background:#1d304d;
  color:white;
  font-size:24px;
  box-shadow:0 4px 8px rgba(0,0,0,.3);
}

.ctrl:active{
  background:#38577e;
  transform:scale(.94);
}

#up{left:58px;top:0}
#left{left:0;top:58px}
#right{right:0;top:58px}
#down{left:58px;bottom:0}

/* =========================
   menu
========================= */

#menu{
  position:absolute;
  z-index:40;
  right:15px;
  bottom:22px;
  width:55px;
  height:55px;
  border-radius:50%;
  border:2px solid #687e9e;
  background:#1d304d;
  color:white;
  font-size:22px;
}

/* =========================
   Battle
========================= */

#battle{
  position:fixed;
  z-index:100;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(5,8,15,.0);
  opacity:0;
  transition:opacity .45s,background .45s;
}

#battle.show{
  display:flex;
  opacity:1;
  background:rgba(5,8,15,.92);
}

.battleBox{
  width:min(90%,430px);
  padding:25px;
  border-radius:20px;
  background:#172237;
  border:2px solid #647b9e;
  color:white;
  text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.5);
}

.enemy{
  font-size:70px;
  margin:10px;
}

.hp{
  height:18px;
  background:#351a1a;
  border-radius:10px;
  overflow:hidden;
  margin:12px 0;
}

.hpbar{
  height:100%;
  width:100%;
  background:#dc4c4c;
  transition:width .25s;
}

.attack{
  margin-top:15px;
  width:100%;
  padding:13px;
  border:0;
  border-radius:12px;
  background:#d46b39;
  color:white;
  font-weight:bold;
}

/* =========================
   responsive
========================= */

@media(min-width:700px){
  #world{
    max-width:700px;
    left:50%;
    transform:translateX(-50%);
    border-left:2px solid #222;
    border-right:2px solid #222;
  }

  #hud{
    left:50%;
    transform:translateX(-50%);
    max-width:700px;
  }
}
</style>
</head>

<body>

<!-- HUD -->
<header id="hud">
  <div id="title">🌱 勇者そらまめ</div>

  <div id="status">
    <div class="badge">Lv.<span id="level">1</span></div>
    <div class="badge">💰 <span id="gold">0</span></div>
  </div>
</header>

<!-- WORLD -->
<main id="world">

  <div id="field">

    <div id="message">
      👣 歩いていると敵が突然あらわれる！
      敵はフィールドには表示されません
    </div>

    <!-- 地形 -->
    <div class="road main"></div>
    <div class="road side"></div>
    <div class="water bottom"></div>

    <!-- 景色 -->
    <div class="tree t1"></div>
    <div class="tree t2"></div>
    <div class="tree t3"></div>
    <div class="tree t4"></div>

    <div class="rock r1"></div>
    <div class="rock r2"></div>
    <div class="rock r3"></div>

    <!-- ステージ -->
    <button class="stage" id="stage1">
      🚪 ステージ1
      <small>山道</small>
    </button>

    <!-- プレイヤー -->
    <div id="player">
      <div id="hero">🧑‍🌾</div>
      <div id="name">そらまめ</div>
      <div id="marker">🌱</div>
    </div>

  </div>

  <!-- 操作 -->
  <div id="controls">
    <button class="ctrl" id="up">▲</button>
    <button class="ctrl" id="left">◀</button>
    <button class="ctrl" id="right">▶</button>
    <button class="ctrl" id="down">▼</button>
  </div>

  <button id="menu">☰</button>

</main>

<!-- Battle -->
<div id="battle">

  <div class="battleBox">

    <h2>⚔️ 敵が現れた！</h2>

    <div class="enemy" id="enemyIcon">👾</div>

    <div id="enemyName">スライム</div>

    <div class="hp">
      <div class="hpbar" id="enemyHP"></div>
    </div>

    <div>
      HP:
      <span id="enemyHPText">30 / 30</span>
    </div>

    <button class="attack" id="attackButton">
      ⚔️ こうげき
    </button>

  </div>

</div>

<script>

/* =========================
   Game Data
========================= */

let level = 1;
let gold = 0;

let playerX = 50;
let playerY = 50;

let steps = 0;
let battle = false;

let enemyHP = 30;
let enemyMaxHP = 30;


/* =========================
   UI
========================= */

const player = document.getElementById("player");
const battleScreen = document.getElementById("battle");

function updatePlayer(){

  player.style.left = playerX + "%";
  player.style.top = playerY + "%";

}


/* =========================
   Movement
========================= */

function move(direction){

  if(battle) return;

  const speed = 4;

  if(direction === "up"){
    playerY -= speed;
  }

  if(direction === "down"){
    playerY += speed;
  }

  if(direction === "left"){
    playerX -= speed;
  }

  if(direction === "right"){
    playerX += speed;
  }

  /* 画面外へ出ない */
  playerX = Math.max(8,Math.min(92,playerX));
  playerY = Math.max(12,Math.min(88,playerY));

  updatePlayer();

  /* 歩行アニメーション */
  player.animate(
    [
      {transform:"translate(-50%,-50%) translateY(0)"},
      {transform:"translate(-50%,-50%) translateY(-5px)"},
      {transform:"translate(-50%,-50%) translateY(0)"}
    ],
    {
      duration:150,
      easing:"ease-out"
    }
  );

  steps++;

  /*
     エンカウントはかなり低め。
     15歩以上歩いてから抽選。
  */
  if(steps >= 15){

    if(Math.random() < 0.06){

      steps = 0;
      encounter();

    }

  }

}


/* =========================
   Controls
========================= */

function setupButton(id,direction){

  const button = document.getElementById(id);

  button.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();
      move(direction);

    },
    {passive:false}
  );

}

setupButton("up","up");
setupButton("down","down");
setupButton("left","left");
setupButton("right","right");


/* =========================
   Keyboard
========================= */

document.addEventListener("keydown",function(e){

  if(
    e.key === "ArrowUp" ||
    e.key === "ArrowDown" ||
    e.key === "ArrowLeft" ||
    e.key === "ArrowRight"
  ){

    e.preventDefault();

  }

  if(e.key === "ArrowUp") move("up");
  if(e.key === "ArrowDown") move("down");
  if(e.key === "ArrowLeft") move("left");
  if(e.key === "ArrowRight") move("right");

});


/* =========================
   Encounter
========================= */

function encounter(){

  battle = true;

  const enemies = [
    ["👾","グリーンスライム",30],
    ["🐺","ワイルドウルフ",40],
    ["🦇","ダークバット",35]
  ];

  const enemy =
    enemies[Math.floor(Math.random()*enemies.length)];

  document.getElementById("enemyIcon").textContent = enemy[0];
  document.getElementById("enemyName").textContent = enemy[1];

  enemyMaxHP = enemy[2];
  enemyHP = enemyMaxHP;

  updateEnemy();

  /*
     フェードイン
  */
  battleScreen.style.display = "flex";

  requestAnimationFrame(function(){

    battleScreen.classList.add("show");

  });

}


/* =========================
   Battle
========================= */

function updateEnemy(){

  document.getElementById("enemyHP").style.width =
    (enemyHP / enemyMaxHP * 100) + "%";

  document.getElementById("enemyHPText").textContent =
    enemyHP + " / " + enemyMaxHP;

}


document.getElementById("attackButton")
.addEventListener("pointerdown",function(e){

  e.preventDefault();

  if(!battle) return;

  /* 攻撃 */
  const damage = 10 + Math.floor(Math.random()*8);

  enemyHP -= damage;

  if(enemyHP <= 0){

    enemyHP = 0;

    updateEnemy();

    setTimeout(function(){

      gold += 50;

      document.getElementById("gold").textContent = gold;

      closeBattle();

    },500);

    return;

  }

  updateEnemy();

});


/* =========================
   Close Battle
========================= */

function closeBattle(){

  battleScreen.classList.remove("show");

  setTimeout(function(){

    battleScreen.style.display = "none";
    battle = false;

  },450);

}


/* =========================
   Stage 1
========================= */

document.getElementById("stage1")
.addEventListener("pointerdown",function(e){

  e.preventDefault();

  if(battle) return;

  stageBattle();

});


function stageBattle(){

  battle = true;

  document.getElementById("enemyIcon").textContent = "👹";
  document.getElementById("enemyName").textContent = "山道の魔物";

  enemyMaxHP = 60;
  enemyHP = 60;

  updateEnemy();

  battleScreen.style.display = "flex";

  requestAnimationFrame(function(){

    battleScreen.classList.add("show");

  });

}


/* =========================
   Disable unwanted gestures
========================= */

document.addEventListener(
  "gesturestart",
  e => e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gesturechange",
  e => e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gestureend",
  e => e.preventDefault(),
  {passive:false}
);


/* ダブルタップズーム対策 */
let lastTouch = 0;

document.addEventListener(
  "touchend",
  function(e){

    const now = Date.now();

    if(now - lastTouch < 350){

      e.preventDefault();

    }

    lastTouch = now;

  },
  {passive:false}
);


/* =========================
   Start
========================= */

updatePlayer();

</script>

</body>
</html>
