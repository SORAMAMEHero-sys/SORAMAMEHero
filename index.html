<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no,
viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>勇者そらまめ</title>

<style>

/* =========================================================
   BASE
========================================================= */

*{
  box-sizing:border-box;

  -webkit-user-select:none;
  user-select:none;

  -webkit-touch-callout:none;

  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;

  overflow:hidden;

  background:#101827;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;

  touch-action:none;
}

button{
  font:inherit;

  -webkit-user-select:none;
  user-select:none;

  touch-action:manipulation;
}


/* =========================================================
   HUD
========================================================= */

#hud{

  position:fixed;

  z-index:100;

  top:0;
  left:0;

  width:100%;
  height:58px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:8px 12px;

  color:white;

  background:#101827;

  border-bottom:
    2px solid #4d6380;
}

#title{
  font-size:15px;
  font-weight:900;
}

.stats{
  display:flex;
  gap:7px;
}

.stat{

  padding:6px 9px;

  border-radius:10px;

  background:#202e46;

  border:
    1px solid #596d8d;

  font-size:13px;

  font-weight:900;
}


/* =========================================================
   FIELD
========================================================= */

#viewport{

  position:absolute;

  left:0;
  top:58px;

  width:100%;
  height:calc(100% - 58px);

  overflow:hidden;

  background:#376e37;
}

#world{

  position:absolute;

  width:2400px;
  height:1800px;

  left:0;
  top:0;

  transform-origin:0 0;

  will-change:transform;

  background-color:#376e37;

  background-image:
    radial-gradient(
      rgba(255,255,255,.08)
      1px,
      transparent 1px
    );

  background-size:35px 35px;
}


/* =========================================================
   MAP
========================================================= */

.road{

  position:absolute;

  background:#927247;

  border:
    6px solid #765a37;

  border-radius:35px;
}

.road.horizontal{

  left:-100px;
  top:760px;

  width:2600px;
  height:190px;
}

.road.vertical{

  left:1120px;
  top:-100px;

  width:190px;
  height:2000px;
}

.water{

  position:absolute;

  left:1450px;
  top:170px;

  width:650px;
  height:390px;

  background:#286f88;

  border:
    7px solid #1d5367;

  border-radius:50px;
}

.village{

  position:absolute;

  left:220px;
  top:700px;

  width:300px;
  height:230px;

  background:#548d43;

  border:
    5px solid #3d6e34;

  border-radius:30px;
}


/* =========================================================
   TREES
========================================================= */

.tree{

  position:absolute;

  width:70px;
  height:70px;

  border-radius:50%;

  background:#28612f;

  border:
    8px solid #1c4824;

  box-shadow:
    inset 0 0 0 5px #3d8140;
}

.tree:after{

  content:"";

  position:absolute;

  left:22px;
  top:58px;

  width:18px;
  height:32px;

  background:#704a2b;

  z-index:-1;
}

.t1{left:300px;top:260px}
.t2{left:700px;top:420px}
.t3{left:830px;top:1280px}
.t4{left:1660px;top:1040px}
.t5{left:2050px;top:1330px}
.t6{left:1900px;top:260px}


/* =========================================================
   ROCKS
========================================================= */

.rock{

  position:absolute;

  width:60px;
  height:42px;

  border-radius:50%;

  background:#6b7279;

  border:
    4px solid #4d5359;
}

.r1{left:600px;top:1080px}
.r2{left:1500px;top:800px}
.r3{left:2050px;top:700px}


/* =========================================================
   STAGE
========================================================= */

.stage{

  position:absolute;

  z-index:10;

  width:150px;
  min-height:68px;

  padding:10px;

  border-radius:16px;

  background:#43251c;

  border:
    3px solid #aa694a;

  color:white;

  font-weight:900;

  text-align:center;

  box-shadow:
    0 6px 15px rgba(0,0,0,.35);
}

.stage small{

  display:block;

  margin-top:4px;

  font-size:11px;

  opacity:.75;
}

#stage1{

  left:1350px;
  top:650px;
}


/* =========================================================
   PLAYER
========================================================= */

#player{

  position:absolute;

  z-index:50;

  width:80px;
  height:90px;

  pointer-events:none;

  transform:
    translate(-50%,-50%);

  text-align:center;
}

#hero{

  font-size:44px;

  line-height:50px;
}

#playerName{

  display:block;

  width:max-content;

  margin:auto;

  padding:3px 9px;

  border-radius:10px;

  background:#111;

  color:white;

  font-size:12px;

  font-weight:900;
}

#marker{

  font-size:20px;
}


/* =========================================================
   MESSAGE
========================================================= */

#message{

  position:fixed;

  z-index:80;

  left:50%;
  top:70px;

  transform:
    translateX(-50%);

  width:max-content;

  max-width:90%;

  padding:7px 12px;

  border-radius:12px;

  background:
    rgba(15,40,20,.88);

  color:#d9ffd9;

  font-size:12px;

  pointer-events:none;
}


/* =========================================================
   CONTROLLER
========================================================= */

#controls{

  position:fixed;

  z-index:90;

  left:15px;
  bottom:18px;

  width:175px;
  height:175px;
}

.control{

  position:absolute;

  width:56px;
  height:56px;

  border-radius:14px;

  border:
    2px solid #617895;

  background:#1d304d;

  color:white;

  font-size:24px;

  box-shadow:
    0 5px 10px rgba(0,0,0,.3);
}

#up{
  left:59px;
  top:0;
}

#left{
  left:0;
  top:59px;
}

#right{
  right:0;
  top:59px;
}

#down{
  left:59px;
  bottom:0;
}

.control:active{

  background:#3a587e;

  transform:scale(.93);
}


/* =========================================================
   WORLD BUTTON
========================================================= */

#worldButton{

  position:fixed;

  z-index:90;

  right:15px;
  bottom:85px;

  width:58px;
  height:58px;

  border-radius:50%;

  border:
    2px solid #647b9c;

  background:#1d304d;

  color:white;

  font-size:22px;
}


/* =========================================================
   WORLD PANEL
========================================================= */

#worldPanel{

  position:fixed;

  z-index:300;

  inset:0;

  display:none;

  align-items:center;

  justify-content:center;

  background:
    rgba(0,0,0,.72);
}

.panel{

  width:85%;

  max-width:350px;

  padding:22px;

  border-radius:18px;

  background:#17243a;

  border:
    2px solid #657b9c;

  color:white;

  text-align:center;
}

.panel button{

  width:100%;

  margin-top:10px;

  padding:12px;

  border:0;

  border-radius:10px;

  background:#304967;

  color:white;
}

.close{

  background:#663b3b !important;
}


/* =========================================================
   BATTLE SCREEN
========================================================= */

#battle{

  position:fixed;

  z-index:1000;

  inset:0;

  display:none;

  overflow:hidden;

  background:#101827;

  color:white;
}

#battle.show{

  display:block;
}


/* =========================================================
   BATTLE BACKGROUND
========================================================= */

#battleScene{

  position:absolute;

  inset:0;

  background:

    radial-gradient(
      circle at 70% 35%,
      rgba(255,195,110,.95),
      transparent 25%
    ),

    radial-gradient(
      circle at 70% 45%,
      rgba(170,80,45,.8),
      transparent 48%
    ),

    linear-gradient(
      160deg,
      #503848 0%,
      #a45c39 45%,
      #30263a 100%
    );
}

#battleScene:after{

  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      transparent 65%,
      rgba(0,0,0,.5)
    );
}


/* =========================================================
   BATTLE TOP
========================================================= */

#battleTop{

  position:absolute;

  z-index:5;

  top:
    max(14px,env(safe-area-inset-top));

  left:50%;

  transform:
    translateX(-50%);

  width:min(92%,520px);

  display:flex;

  justify-content:space-between;

  gap:12px;
}

.enemyCard,
.allyCard{

  background:
    rgba(12,21,37,.92);

  border:
    2px solid #60738f;

  border-radius:14px;

  padding:9px 12px;

  box-shadow:
    0 8px 20px rgba(0,0,0,.3);
}

.enemyCard{

  width:170px;
}

.enemyName{

  font-size:14px;

  font-weight:900;
}

.bar{

  height:10px;

  background:#361d25;

  border-radius:99px;

  overflow:hidden;

  margin:5px 0;
}

.bar i{

  display:block;

  width:100%;
  height:100%;

  background:#e04e5c;

  transition:
    width .3s;
}

.hpText{

  font-size:11px;

  color:#dce5f2;
}


/* =========================================================
   ENEMY
========================================================= */

#enemySprite{

  position:absolute;

  z-index:4;

  left:70%;
  top:39%;

  transform:
    translate(-50%,-50%);

  font-size:120px;

  filter:
    drop-shadow(
      0 14px 8px
      rgba(0,0,0,.38)
    );
}

#enemySprite.hit{

  animation:
    enemyHit .28s;
}

@keyframes enemyHit{

  0%,100%{
    transform:
      translate(-50%,-50%);
  }

  35%{
    transform:
      translate(calc(-50% - 12px),-50%)
      rotate(-6deg);
  }

  70%{
    transform:
      translate(calc(-50% + 10px),-50%)
      rotate(5deg);
  }
}


/* =========================================================
   DAMAGE
========================================================= */

.damageFloat{

  position:absolute;

  z-index:10;

  left:70%;
  top:39%;

  font-size:28px;

  font-weight:900;

  color:white;

  text-shadow:
    0 3px 5px #8d1720;

  transform:
    translate(-50%,-50%);

  animation:
    damageUp .7s forwards;

  pointer-events:none;
}

@keyframes damageUp{

  to{

    opacity:0;

    transform:
      translate(-50%,-120px)
      scale(1.25);
  }
}


/* =========================================================
   ALLIES
========================================================= */

#battleAllies{

  position:absolute;

  z-index:4;

  left:50%;

  bottom:160px;

  transform:
    translateX(-50%);

  width:min(94%,520px);

  display:flex;

  justify-content:flex-end;

  align-items:end;

  gap:18px;
}

.ally{

  width:110px;

  text-align:center;
}

.allyIcon{

  font-size:65px;

  line-height:70px;

  filter:
    drop-shadow(
      0 9px 5px
      rgba(0,0,0,.35)
    );
}

.allyName{

  background:#10203a;

  border:
    2px solid #526d8f;

  border-radius:8px;

  padding:3px;

  font-size:11px;

  font-weight:900;
}

.allyHp{

  height:7px;

  background:#17231d;

  border-radius:99px;

  margin-top:3px;

  overflow:hidden;
}

.allyHp i{

  display:block;

  width:100%;

  height:100%;

  background:#55cf7a;

  transition:
    width .3s;
}


/* =========================================================
   BATTLE LOG
========================================================= */

#battleLog{

  position:absolute;

  z-index:5;

  left:50%;

  bottom:310px;

  transform:
    translateX(-50%);

  width:min(90%,430px);

  min-height:38px;

  padding:9px 12px;

  border-radius:12px;

  background:
    rgba(10,17,29,.78);

  border:
    1px solid rgba(255,255,255,.22);

  font-size:12px;

  text-align:center;
}


/* =========================================================
   COMMANDS
========================================================= */

#commandPanel{

  position:absolute;

  z-index:10;

  left:0;
  right:0;
  bottom:0;

  padding:
    10px
    max(10px,env(safe-area-inset-right))
    max(10px,env(safe-area-inset-bottom))
    max(10px,env(safe-area-inset-left));

  background:
    linear-gradient(
      180deg,
      rgba(8,15,28,.1),
      rgba(8,15,28,.97) 25%
    );

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:8px;
}

.cmd{

  min-height:58px;

  border:
    2px solid #506685;

  border-radius:12px;

  background:#263b5a;

  color:white;

  font-weight:900;

  box-shadow:
    0 5px 12px
    rgba(0,0,0,.25);
}

.cmd:active{

  transform:scale(.97);
}

.cmd.attack{

  background:#a64f3b;

  border-color:#c47b67;
}

.cmd.skill{

  background:#55458c;

  border-color:#806bc1;
}

.cmd.guard{

  background:#304a69;
}

.cmd.run{

  background:#293a51;
}


/* =========================================================
   SKILL MENU
========================================================= */

#skillMenu{

  position:absolute;

  z-index:20;

  left:50%;

  bottom:125px;

  transform:
    translateX(-50%);

  display:none;

  width:min(90%,400px);

  padding:12px;

  border-radius:16px;

  background:#121e33;

  border:
    2px solid #667d9e;

  box-shadow:
    0 12px 30px
    rgba(0,0,0,.45);
}

#skillMenu.show{

  display:block;
}

.skillBtn{

  width:100%;

  padding:11px;

  margin-top:7px;

  border:0;

  border-radius:10px;

  background:#3f3470;

  color:white;

  text-align:left;
}

.skillBtn:first-child{

  margin-top:0;
}


/* =========================================================
   RESULT
========================================================= */

#battleResult{

  position:absolute;

  z-index:50;

  inset:0;

  display:none;

  align-items:center;

  justify-content:center;

  background:
    rgba(5,9,17,.84);
}

.resultBox{

  width:min(86%,380px);

  padding:28px;

  border-radius:20px;

  background:#19263d;

  border:
    2px solid #6c82a3;

  text-align:center;

  box-shadow:
    0 20px 50px
    rgba(0,0,0,.6);
}

.resultBox h2{

  margin:
    0 0 10px;
}

.resultBox button{

  width:100%;

  padding:13px;

  border:0;

  border-radius:12px;

  background:#bd653e;

  color:white;

  font-weight:900;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-height:650px){

  #battleAllies{

    bottom:145px;
  }

  .allyIcon{

    font-size:52px;

    line-height:56px;
  }

  #battleLog{

    bottom:270px;
  }

  .cmd{

    min-height:50px;
  }
}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

  #viewport{

    width:700px;

    left:50%;

    transform:
      translateX(-50%);
  }

  #hud{

    width:700px;

    left:50%;

    transform:
      translateX(-50%);
  }
}

</style>
</head>

<body>


<!-- =======================================================
     HUD
======================================================= -->

<header id="hud">

  <div id="title">
    🌱 勇者そらまめ
  </div>

  <div class="stats">

    <div class="stat">
      Lv.<span id="level">1</span>
    </div>

    <div class="stat">
      💰 <span id="gold">0</span>
    </div>

  </div>

</header>


<!-- =======================================================
     FIELD
======================================================= -->

<div id="viewport">

  <div id="world">

    <div class="road horizontal"></div>

    <div class="road vertical"></div>

    <div class="water"></div>

    <div class="village"></div>


    <div class="tree t1"></div>
    <div class="tree t2"></div>
    <div class="tree t3"></div>
    <div class="tree t4"></div>
    <div class="tree t5"></div>
    <div class="tree t6"></div>


    <div class="rock r1"></div>
    <div class="rock r2"></div>
    <div class="rock r3"></div>


    <button
      class="stage"
      id="stage1">

      🚪 ステージ1

      <small>
        山道
      </small>

    </button>


    <div id="player">

      <div id="hero">
        🧑‍🌾
      </div>

      <div id="playerName">
        そらまめ
      </div>

      <div id="marker">
        🌱
      </div>

    </div>

  </div>

</div>


<!-- =======================================================
     MESSAGE
======================================================= -->

<div id="message">
  👣 フィールドを探索しよう！
</div>


<!-- =======================================================
     CONTROLS
======================================================= -->

<div id="controls">

  <button
    class="control"
    id="up">
    ▲
  </button>

  <button
    class="control"
    id="left">
    ◀
  </button>

  <button
    class="control"
    id="right">
    ▶
  </button>

  <button
    class="control"
    id="down">
    ▼
  </button>

</div>


<button id="worldButton">
  🌎
</button>


<!-- =======================================================
     WORLD PANEL
======================================================= -->

<div id="worldPanel">

  <div class="panel">

    <h2>
      🌎 世界移動
    </h2>

    <p>
      行き先を選択
    </p>

    <button id="surfaceSave">
      🌱 表世界・セーブポイント
    </button>

    <button id="underSave">
      🌑 裏世界・セーブポイント
    </button>

    <button
      class="close"
      id="closeWorld">
      閉じる
    </button>

  </div>

</div>


<!-- =======================================================
     BATTLE
======================================================= -->

<div id="battle">

  <div id="battleScene"></div>


  <div id="battleTop">

    <div class="enemyCard">

      <div
        class="enemyName"
        id="enemyName">

        サンドプラント

      </div>

      <div class="bar">

        <i id="enemyHPBar"></i>

      </div>

      <div class="hpText">

        HP
        <span id="enemyHPText">
          45 / 45
        </span>

      </div>

    </div>


    <div class="allyCard">

      ⚔️ 戦闘中

      <br>

      <span class="hpText">
        そらまめ &amp; えんどう
      </span>

    </div>

  </div>


  <div id="enemySprite">
    🌵
  </div>


  <div id="battleLog">
    敵の様子をうかがっている…
  </div>


  <div id="battleAllies">

    <div class="ally">

      <div class="allyIcon">
        🛡️
      </div>

      <div class="allyName">
        えんどう
      </div>

      <div class="allyHp">
        <i></i>
      </div>

    </div>


    <div class="ally">

      <div
        class="allyIcon"
        id="battleHero">

        🧑‍🌾

      </div>

      <div class="allyName">
        そらまめ
      </div>

      <div class="allyHp">
        <i id="playerHPBar"></i>
      </div>

    </div>

  </div>


  <!-- SKILL -->

  <div id="skillMenu">

    <button
      class="skillBtn"
      data-skill="fire">

      🔥 ファイア　
      敵に大ダメージ

    </button>

    <button
      class="skillBtn"
      data-skill="heal">

      💚 ヒール　
      HPを回復

    </button>

    <button
      class="skillBtn"
      data-skill="back">

      ↩️ 戻る

    </button>

  </div>


  <!-- COMMAND -->

  <div id="commandPanel">

    <button
      class="cmd attack"
      id="attackButton">

      ⚔️ こうげき

    </button>


    <button
      class="cmd skill"
      id="skillButton">

      ✨ スキル

    </button>


    <button
      class="cmd guard"
      id="guardButton">

      🛡️ ぼうぎょ

    </button>


    <button
      class="cmd run"
      id="runButton">

      🏃 にげる

    </button>

  </div>


  <!-- RESULT -->

  <div id="battleResult">

    <div class="resultBox">

      <h2 id="resultTitle">
        🎉 勝利！
      </h2>

      <p id="resultText">
        30Gを手に入れた！
      </p>

      <button id="resultButton">
        フィールドへ戻る
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   GAME DATA
========================================================= */

const game = {

  level:1,

  gold:0,

  battle:false,

  steps:0,

  guard:false,

  player:{

    x:1200,

    y:900,

    hp:60,

    maxHp:60

  },

  camera:{

    x:0,

    y:0

  },

  enemy:{

    hp:45,

    maxHp:45,

    name:"サンドプラント",

    icon:"🌵"

  }

};


/* =========================================================
   SHORTCUT
========================================================= */

const $ =
  id =>
    document.getElementById(id);


/* =========================================================
   ELEMENTS
========================================================= */

const viewport =
  $("viewport");

const world =
  $("world");

const player =
  $("player");

const battle =
  $("battle");


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  $("level").textContent =
    game.level;

  $("gold").textContent =
    game.gold;

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

  const width =
    viewport.clientWidth;

  const height =
    viewport.clientHeight;


  let cameraX =
    game.player.x -
    width / 2;

  let cameraY =
    game.player.y -
    height / 2;


  cameraX =
    Math.max(
      0,
      Math.min(
        cameraX,
        2400 - width
      )
    );


  cameraY =
    Math.max(
      0,
      Math.min(
        cameraY,
        1800 - height
      )
    );


  game.camera.x =
    cameraX;

  game.camera.y =
    cameraY;


  /*
    ワールドだけをカメラ移動。

    プレイヤーはワールドと同じ座標系で
    正しい位置に置く。
  */

  world.style.transform =
    `translate3d(
      ${-cameraX}px,
      ${-cameraY}px,
      0
    )`;


  player.style.left = game.player.x + "px";
player.style.top = game.player.y + "px";

}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer;

function showMessage(text){

  const message =
    $("message");


  message.textContent =
    text;


  clearTimeout(
    messageTimer
  );


  messageTimer =
    setTimeout(
      () => {

        message.textContent =
          "👣 フィールドを探索しよう！";

      },
      1800
    );

}


/* =========================================================
   FIELD MOVE
========================================================= */

function move(direction){

  if(game.battle)
    return;


  const speed =
    12;


  if(direction === "up")
    game.player.y -= speed;


  if(direction === "down")
    game.player.y += speed;


  if(direction === "left")
    game.player.x -= speed;


  if(direction === "right")
    game.player.x += speed;


  game.player.x =
    Math.max(
      40,
      Math.min(
        2360,
        game.player.x
      )
    );


  game.player.y =
    Math.max(
      40,
      Math.min(
        1760,
        game.player.y
      )
    );


  updateCamera();


  player.animate(

    [

      {
        transform:
          "translate(-50%,-50%)"
      },

      {
        transform:
          "translate(-50%,-50%) translateY(-7px)"
      },

      {
        transform:
          "translate(-50%,-50%)"
      }

    ],

    {

      duration:150,

      easing:"ease-out"

    }

  );


  game.steps++;


  /*
    エンカウント率を低めに。

    18歩以上歩くまで
    エンカウントしない。
  */

  if(

    game.steps >= 18 &&

    Math.random() < 0.035

  ){

    game.steps = 0;

    startBattle(false);

  }

}


/* =========================================================
   CONTROLS
========================================================= */

function bindControl(
  id,
  direction
){

  $(id).addEventListener(

    "pointerdown",

    event => {

      event.preventDefault();

      event.stopPropagation();

      move(direction);

    },

    {
      passive:false
    }

  );

}


bindControl(
  "up",
  "up"
);

bindControl(
  "down",
  "down"
);

bindControl(
  "left",
  "left"
);

bindControl(
  "right",
  "right"
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(

  "keydown",

  event => {

    const keys = {

      ArrowUp:"up",

      ArrowDown:"down",

      ArrowLeft:"left",

      ArrowRight:"right"

    };


    const direction =
      keys[event.key];


    if(direction){

      event.preventDefault();

      move(direction);

    }

  }

);


/* =========================================================
   ENEMY
========================================================= */

function setEnemy(
  name,
  icon,
  hp
){

  game.enemy = {

    name:name,

    icon:icon,

    hp:hp,

    maxHp:hp

  };


  $("enemyName").textContent =
    name;

  $("enemySprite").textContent =
    icon;


  updateEnemy();

}


/* =========================================================
   ENEMY HP
========================================================= */

function updateEnemy(){

  const percent =
    Math.max(
      0,
      game.enemy.hp /
      game.enemy.maxHp *
      100
    );


  $("enemyHPBar").style.width =
    percent + "%";


  $("enemyHPText").textContent =

    game.enemy.hp +
    " / " +
    game.enemy.maxHp;

}


/* =========================================================
   PLAYER HP
========================================================= */

function updatePlayerHP(){

  const percent =

    Math.max(
      0,
      game.player.hp /
      game.player.maxHp *
      100
    );


  $("playerHPBar").style.width =
    percent + "%";

}


/* =========================================================
   START BATTLE
========================================================= */

function startBattle(stage){

  game.battle =
    true;

  game.guard =
    false;

  game.player.hp =
    game.player.maxHp;


  /*
    ステージ戦
  */

  if(stage){

    setEnemy(
      "山道の魔物",
      "👹",
      65
    );

  }

  /*
    ランダム戦
  */

  else{

    const enemies = [

      [
        "サンドプラント",
        "🌵",
        45
      ],

      [
        "グリーンスライム",
        "👾",
        32
      ],

      [
        "ワイルドウルフ",
        "🐺",
        50
      ]

    ];


    const enemy =
      enemies[
        Math.floor(
          Math.random() *
          enemies.length
        )
      ];


    setEnemy(
      enemy[0],
      enemy[1],
      enemy[2]
    );

  }


  updatePlayerHP();


  $("battleLog").textContent =

    game.enemy.name +
    "が現れた！";


  $("battleResult").style.display =
    "none";


  $("skillMenu")
    .classList
    .remove("show");


  /*
    ここでフィールドとは
    完全に別画面になる。
  */

  battle.classList.add(
    "show"
  );

}


/* =========================================================
   DAMAGE EFFECT
========================================================= */

function damageFloat(
  amount
){

  const damage =
    document.createElement(
      "div"
    );


  damage.className =
    "damageFloat";


  damage.textContent =
    "-" + amount;


  battle.appendChild(
    damage
  );


  setTimeout(
    () => damage.remove(),
    750
  );

}


/* =========================================================
   ENEMY HIT
========================================================= */

function enemyHit(){

  const sprite =
    $("enemySprite");


  sprite.classList.remove(
    "hit"
  );


  void sprite.offsetWidth;


  sprite.classList.add(
    "hit"
  );

}


/* =========================================================
   ENEMY ATTACK
========================================================= */

function enemyAttack(){

  if(!game.battle)
    return;


  let damage =

    5 +
    Math.floor(
      Math.random() * 6
    );


  if(game.guard){

    damage =
      Math.ceil(
        damage / 2
      );

  }


  game.player.hp =
    Math.max(
      0,
      game.player.hp -
      damage
    );


  updatePlayerHP();


  if(game.guard){

    $("battleLog").textContent =
      "🛡️ 防御成功！ " +
      damage +
      "ダメージ！";

  }

  else{

    $("battleLog").textContent =
      game.enemy.name +
      "の攻撃！ " +
      damage +
      "ダメージ！";

  }


  game.guard =
    false;


  if(
    game.player.hp <= 0
  ){

    showBattleResult(
      false
    );

  }

}


/* =========================================================
   ATTACK
========================================================= */

function playerAttack(){

  if(!game.battle)
    return;


  const damage =

    8 +
    Math.floor(
      Math.random() * 8
    );


  game.enemy.hp =

    Math.max(
      0,
      game.enemy.hp -
      damage
    );


  updateEnemy();

  enemyHit();

  damageFloat(
    damage
  );


  $("battleLog").textContent =

    "⚔️ そらまめの攻撃！ " +
    damage +
    "ダメージ！";


  if(
    game.enemy.hp <= 0
  ){

    setTimeout(
      () => {

        showBattleResult(
          true
        );

      },
      350
    );

    return;

  }


  setTimeout(
    enemyAttack,
    650
  );

}


/* =========================================================
   ATTACK BUTTON
========================================================= */

$("attackButton")
.addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();

    playerAttack();

  }

);


/* =========================================================
   SKILL MENU
========================================================= */

$("skillButton")
.addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();


    if(!game.battle)
      return;


    $("skillMenu")
      .classList
      .toggle("show");

  }

);


/* =========================================================
   SKILLS
========================================================= */

document
  .querySelectorAll(
    ".skillBtn"
  )
  .forEach(

    button => {

      button.addEventListener(

        "pointerdown",

        event => {

          event.preventDefault();


          const skill =
            button.dataset.skill;


          /*
            戻る
          */

          if(
            skill === "back"
          ){

            $("skillMenu")
              .classList
              .remove("show");

            return;

          }


          /*
            ファイア
          */

          if(
            skill === "fire"
          ){

            const damage =

              14 +
              Math.floor(
                Math.random() * 10
              );


            game.enemy.hp =

              Math.max(
                0,
                game.enemy.hp -
                damage
              );


            updateEnemy();

            enemyHit();

            damageFloat(
              damage
            );


            $("battleLog")
              .textContent =

              "🔥 ファイア！ " +
              damage +
              "ダメージ！";


            $("skillMenu")
              .classList
              .remove("show");


            if(
              game.enemy.hp <= 0
            ){

              setTimeout(
                () => {

                  showBattleResult(
                    true
                  );

                },
                350
              );

              return;

            }


            setTimeout(
              enemyAttack,
              700
            );

          }


          /*
            ヒール
          */

          if(
            skill === "heal"
          ){

            const heal =
              15;


            game.player.hp =

              Math.min(
                game.player.maxHp,
                game.player.hp +
                heal
              );


            updatePlayerHP();


            $("battleLog")
              .textContent =

              "💚 HPが " +
              heal +
              " 回復した！";


            $("skillMenu")
              .classList
              .remove("show");


            setTimeout(
              enemyAttack,
              700
            );

          }

        }

      );

    }

  );


/* =========================================================
   GUARD
========================================================= */

$("guardButton")
.addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();


    if(!game.battle)
      return;


    game.guard =
      true;


    $("battleLog")
      .textContent =

      "🛡️ そらまめは身を守っている！";


    setTimeout(
      enemyAttack,
      650
    );

  }

);


/* =========================================================
   RUN
========================================================= */

$("runButton")
.addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();


    if(!game.battle)
      return;


    const success =
      Math.random() < 0.7;


    if(success){

      $("battleLog")
        .textContent =

        "🏃 うまく逃げ切った！";


      setTimeout(
        endBattle,
        500
      );

    }

    else{

      $("battleLog")
        .textContent =

        "❌ 逃げられない！";


      setTimeout(
        enemyAttack,
        600
      );

    }

  }

);


/* =========================================================
   BATTLE RESULT
========================================================= */

function showBattleResult(
  victory
){

  if(!game.battle)
    return;


  $("battleResult")
    .style
    .display = "flex";


  if(victory){

    game.gold +=
      30;


    updateHUD();


    $("resultTitle")
      .textContent =
      "🎉 勝利！";


    $("resultText")
      .textContent =
      "30Gを手に入れた！";

  }

  else{

    $("resultTitle")
      .textContent =
      "💀 敗北…";


    $("resultText")
      .textContent =
      "フィールドへ戻ります。";

  }

}


/* =========================================================
   END BATTLE
========================================================= */

function endBattle(){

  game.battle =
    false;


  battle.classList.remove(
    "show"
  );


  $("battleResult")
    .style
    .display = "none";


  $("skillMenu")
    .classList
    .remove("show");


  game.player.hp =
    game.player.maxHp;


  updatePlayerHP();


  showMessage(
    "🌱 フィールドへ戻った！"
  );

}


/* =========================================================
   RESULT BUTTON
========================================================= */

$("resultButton")
.addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();

    endBattle();

  }

);


/* =========================================================
   STAGE 1
========================================================= */

$("stage1")
.addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();


    if(game.battle)
      return;


    startBattle(
      true
    );

  }

);


/* =========================================================
   WORLD
========================================================= */

$("worldButton")
.addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();

    $("worldPanel")
      .style
      .display = "flex";

  }

);


$("closeWorld")
.addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();

    $("worldPanel")
      .style
      .display = "none";

  }

);


$("surfaceSave")
.addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();

    $("worldPanel")
      .style
      .display = "none";


    showMessage(
      "🌱 表世界のセーブポイントへ！"
    );

  }

);


$("underSave")
.addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();

    $("worldPanel")
      .style
      .display = "none";


    showMessage(
      "🌑 裏世界のセーブポイントへ！"
    );

  }

);


/* =========================================================
   MOBILE / SAFARI
========================================================= */

let lastTouch =
  0;


document.addEventListener(

  "touchend",

  event => {

    const now =
      Date.now();


    /*
      ダブルタップズーム防止
    */

    if(
      now - lastTouch <
      350
    ){

      event.preventDefault();

    }


    lastTouch =
      now;

  },

  {
    passive:false
  }

);


/*
  ピンチズーム防止
*/

document.addEventListener(

  "touchmove",

  event => {

    if(
      event.touches.length >
      1
    ){

      event.preventDefault();

    }

  },

  {
    passive:false
  }

);


/*
  Safariジェスチャー防止
*/

[
  "gesturestart",
  "gesturechange",
  "gestureend"

].forEach(

  type => {

    document.addEventListener(

      type,

      event => {

        event.preventDefault();

      },

      {
        passive:false
      }

    );

  }

);


/* =========================================================
   START
========================================================= */

window.addEventListener(
  "resize",
  updateCamera
);


updateHUD();

updatePlayerHP();

updateCamera();

</script>

</html>
