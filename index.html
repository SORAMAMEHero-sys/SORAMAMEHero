<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>勇者そらまめ</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101725;
  font-family:system-ui,sans-serif;
  touch-action:none;
}

button{
  font:inherit;
}

/* =========================
   HUD
========================= */

#hud{
  position:fixed;
  z-index:50;
  top:0;
  left:0;
  width:100%;
  height:58px;

  background:#101827;
  border-bottom:2px solid #536984;

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:8px 12px;
}

#title{
  font-weight:800;
  font-size:15px;
}

.stats{
  display:flex;
  gap:6px;
}

.stat{
  background:#22314a;
  border:1px solid #607595;
  border-radius:10px;
  padding:6px 9px;
  font-size:13px;
  font-weight:800;
}


/* =========================
   FIELD
========================= */

#viewport{
  position:absolute;
  top:58px;
  left:0;

  width:100%;
  height:calc(100% - 58px);

  overflow:hidden;
  background:#356c37;
}

#world{
  position:absolute;

  width:2400px;
  height:1800px;

  left:0;
  top:0;

  background:#376e37;

  background-image:
    radial-gradient(
      rgba(255,255,255,.07) 1px,
      transparent 1px
    );

  background-size:35px 35px;

  will-change:transform;
}


/* =========================
   MAP
========================= */

.road{
  position:absolute;

  background:#927247;
  border:6px solid #765a37;

  border-radius:35px;
}

.horizontal{
  left:-100px;
  top:760px;

  width:2600px;
  height:190px;
}

.vertical{
  left:1120px;
  top:-100px;

  width:190px;
  height:2000px;
}

.water{
  position:absolute;

  left:1450px;
  top:170px;

  width:650px;
  height:390px;

  background:#286f88;

  border:7px solid #1d5367;
  border-radius:50px;
}

.village{
  position:absolute;

  left:220px;
  top:700px;

  width:300px;
  height:230px;

  background:#548d43;

  border:5px solid #3d6e34;
  border-radius:30px;
}


/* =========================
   TREES
========================= */

.tree{
  position:absolute;

  width:70px;
  height:70px;

  border-radius:50%;

  background:#28612f;

  border:8px solid #1c4824;

  box-shadow:
    inset 0 0 0 5px #3d8140;
}

.tree:after{
  content:"";

  position:absolute;

  left:22px;
  top:58px;

  width:18px;
  height:32px;

  background:#704a2b;

  z-index:-1;
}

.t1{
  left:300px;
  top:260px;
}

.t2{
  left:700px;
  top:420px;
}

.t3{
  left:830px;
  top:1280px;
}

.t4{
  left:1660px;
  top:1040px;
}

.t5{
  left:2050px;
  top:1330px;
}

.t6{
  left:1900px;
  top:260px;
}


/* =========================
   ROCK
========================= */

.rock{
  position:absolute;

  width:60px;
  height:42px;

  border-radius:50%;

  background:#6b7279;

  border:4px solid #4d5359;
}

.r1{
  left:600px;
  top:1080px;
}

.r2{
  left:1500px;
  top:800px;
}

.r3{
  left:2050px;
  top:700px;
}


/* =========================
   STAGE
========================= */

.stage{
  position:absolute;
  z-index:10;

  width:140px;
  min-height:65px;

  padding:10px;

  border-radius:16px;

  background:#43251c;

  border:3px solid #aa694a;

  color:#fff;

  font-weight:800;

  text-align:center;

  box-shadow:
    0 6px 15px #0006;
}

.stage small{
  display:block;

  margin-top:4px;

  font-size:11px;

  opacity:.75;
}

#stage1{
  left:1350px;
  top:650px;
}


/* =========================
   PLAYER
========================= */

#player{
  position:absolute;

  z-index:50;

  width:80px;
  height:90px;

  pointer-events:none;

  transform:translate(-50%,-50%);

  text-align:center;
}

#hero{
  font-size:44px;
  line-height:50px;
}

#playerName{
  display:block;

  width:max-content;

  margin:auto;

  padding:3px 9px;

  border-radius:10px;

  background:#111;

  color:#fff;

  font-size:12px;

  font-weight:800;
}

#marker{
  font-size:20px;
}


/* =========================
   MESSAGE
========================= */

#message{
  position:fixed;

  z-index:55;

  left:50%;
  top:70px;

  transform:translateX(-50%);

  width:max-content;
  max-width:90%;

  padding:7px 12px;

  border-radius:12px;

  background:#0f2814e8;

  color:#d9ffd9;

  font-size:12px;

  pointer-events:none;
}


/* =========================
   CONTROLS
========================= */

#controls{
  position:fixed;

  z-index:60;

  left:15px;
  bottom:18px;

  width:175px;
  height:175px;
}

.control{
  position:absolute;

  width:56px;
  height:56px;

  border-radius:14px;

  border:2px solid #617895;

  background:#1d304d;

  color:white;

  font-size:24px;

  box-shadow:
    0 5px 10px #0005;
}

.control:active{
  background:#3a587e;

  transform:scale(.93);
}

#up{
  left:59px;
}

#left{
  left:0;
  top:59px;
}

#right{
  right:0;
  top:59px;
}

#down{
  left:59px;
  bottom:0;
}


/* =========================
   WORLD BUTTON
========================= */

#worldButton{
  position:fixed;

  z-index:60;

  right:15px;
  bottom:85px;

  width:58px;
  height:58px;

  border-radius:50%;

  border:2px solid #647b9c;

  background:#1d304d;

  color:white;

  font-size:22px;
}


/* =========================================================
   BATTLE
========================================================= */

#battle{
  position:fixed;

  inset:0;

  z-index:200;

  display:none;

  opacity:0;

  background:#05070dcc;

  transition:opacity .35s;
}

#battle.show{
  opacity:1;
}


/* =========================
   BATTLE SCENE
========================= */

.battleScene{
  position:absolute;

  inset:0;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 38%,
      #f1bd61 0,
      #b76b38 24%,
      #593536 52%,
      #11182a 100%
    );
}

.battleScene:before{
  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      155deg,
      transparent 0 38%,
      #ffffff12 38.2% 38.8%,
      transparent 39%
    ),
    linear-gradient(
      25deg,
      transparent 0 55%,
      #00000018 55.2% 56%,
      transparent 56.2%
    );

  pointer-events:none;
}

.battleGlow{
  position:absolute;

  left:50%;
  top:32%;

  width:65vw;
  height:40vw;

  max-width:600px;
  max-height:360px;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:#ffd97855;

  filter:blur(35px);
}


/* =========================
   ENEMY INFO
========================= */

.battleTop{
  position:absolute;

  left:10px;
  right:10px;
  top:10px;

  display:flex;

  justify-content:space-between;
  align-items:flex-start;

  color:white;

  z-index:4;
}

.enemyInfo{
  background:#111827dd;

  border:2px solid #7183a0;

  border-radius:12px;

  padding:8px 12px;

  min-width:145px;

  box-shadow:
    0 5px 20px #0007;
}

.enemyInfo b{
  font-size:16px;
}

.enemyHP{
  height:10px;

  background:#3b1b22;

  border-radius:8px;

  overflow:hidden;

  margin-top:6px;
}

.enemyHP i{
  display:block;

  height:100%;

  width:100%;

  background:#e24d55;

  transition:width .25s;
}

.battleNotice{
  background:#111827dd;

  border:1px solid #7183a0;

  border-radius:12px;

  padding:8px 11px;

  font-size:12px;

  max-width:48%;

  text-align:right;
}


/* =========================
   ENEMY
========================= */

.enemySprite{
  position:absolute;

  z-index:3;

  left:50%;
  top:34%;

  transform:translate(-50%,-50%);

  font-size:clamp(85px,22vw,150px);

  filter:
    drop-shadow(0 14px 8px #0008);

  transition:
    transform .18s,
    filter .18s;
}

.enemySprite.hit{
  animation:hit .22s;
}

.enemySprite.defeat{
  animation:defeat .55s forwards;
}

@keyframes hit{

  0%,100%{
    transform:translate(-50%,-50%);
  }

  40%{
    transform:
      translate(
        calc(-50% + 12px),
        -50%
      )
      rotate(4deg);

    filter:
      drop-shadow(0 0 18px #fff);
  }

}

@keyframes defeat{

  to{
    transform:
      translate(-50%,-35%)
      scale(.2)
      rotate(20deg);

    opacity:0;
  }

}


/* =========================
   PARTY
========================= */

.party{
  position:absolute;

  z-index:3;

  left:0;
  right:0;

  bottom:155px;

  height:145px;

  display:flex;

  justify-content:center;

  align-items:flex-end;

  gap:clamp(8px,4vw,35px);
}

.heroCard{
  width:min(28vw,125px);

  min-width:92px;

  text-align:center;

  color:white;

  text-shadow:
    0 2px 3px #000;
}

.heroSprite{
  font-size:clamp(50px,14vw,82px);

  line-height:75px;

  filter:
    drop-shadow(0 8px 5px #0008);
}

.heroCard.active .heroSprite{
  animation:bob .6s infinite alternate;
}

.heroCard.down{
  filter:grayscale(1);

  opacity:.5;
}

.heroCard b{
  display:block;

  background:#111c2de8;

  border:1px solid #70809b;

  border-radius:8px 8px 0 0;

  font-size:12px;

  padding:3px;
}

.miniHP{
  height:8px;

  background:#3b1b22;

  border:1px solid #111;

  border-radius:0 0 7px 7px;

  overflow:hidden;
}

.miniHP i{
  display:block;

  width:100%;
  height:100%;

  background:#55c96b;
}

@keyframes bob{

  to{
    transform:translateY(-8px);
  }

}


/* =========================
   DAMAGE
========================= */

#damage{
  position:absolute;

  z-index:10;

  left:50%;
  top:38%;

  font-size:clamp(35px,10vw,65px);

  font-weight:1000;

  color:#ffe35c;

  text-shadow:
    3px 3px 0 #7a241d,
    -2px -2px 0 #fff;

  opacity:0;

  pointer-events:none;
}

.damagePop{
  animation:
    damage .75s ease-out forwards;
}

@keyframes damage{

  0%{
    opacity:0;

    transform:
      translate(-50%,10px)
      scale(.5);
  }

  20%{
    opacity:1;

    transform:
      translate(-50%,0)
      scale(1.2);
  }

  100%{
    opacity:0;

    transform:
      translate(-50%,-65px)
      scale(1);
  }

}


/* =========================
   TURN
========================= */

.turn{
  position:absolute;

  right:10px;
  bottom:155px;

  z-index:9;

  background:#f0b437;

  color:#231806;

  border-radius:99px;

  padding:5px 9px;

  font-size:11px;

  font-weight:900;
}


/* =========================
   AUTO
========================= */

#autoBtn{
  position:absolute;

  right:10px;
  top:64px;

  z-index:9;

  border:1px solid #6d7e99;

  background:#17253a;

  color:#fff;

  border-radius:99px;

  padding:7px 10px;

  font-size:11px;

  font-weight:800;
}


/* =========================
   BATTLE UI
========================= */

.battleUI{
  position:absolute;

  z-index:8;

  left:0;
  right:0;
  bottom:0;

  min-height:150px;

  background:
    linear-gradient(
      #111b2cf2,
      #0a101cf7
    );

  border-top:2px solid #71809a;

  padding:
    9px
    10px
    calc(9px + env(safe-area-inset-bottom));

  display:flex;

  gap:8px;
}

.command{
  flex:1;

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:7px;
}

.cmd{
  border:1px solid #70819c;

  border-radius:11px;

  background:#263750;

  color:#fff;

  font-weight:900;

  font-size:14px;

  box-shadow:
    0 3px 8px #0006;
}

.cmd:active{
  transform:scale(.96);

  background:#4a6488;
}

.cmd.attack{
  background:#8f4936;
}

.cmd.magic{
  background:#4b427e;
}

.log{
  flex:1;

  min-width:0;

  border:1px solid #52647f;

  border-radius:11px;

  background:#0d1624d9;

  color:#eaf1ff;

  padding:8px;

  font-size:12px;

  line-height:1.55;

  overflow:hidden;
}

.log strong{
  color:#ffd875;
}


/* =========================
   RETURN
========================= */

#battleClose{
  display:none;

  position:absolute;

  z-index:12;

  left:50%;
  top:57%;

  transform:translate(-50%,-50%);

  border:0;

  border-radius:14px;

  padding:12px 28px;

  background:#e0a33b;

  color:#1c1308;

  font-weight:1000;

  box-shadow:
    0 5px 18px #0008;
}


/* =========================
   WORLD PANEL
========================= */

#worldPanel{
  position:fixed;

  z-index:300;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  background:#000b;
}

.panel{
  width:85%;

  max-width:350px;

  padding:22px;

  border-radius:18px;

  background:#17243a;

  border:2px solid #657b9c;

  color:white;

  text-align:center;
}

.panel button{
  width:100%;

  margin-top:10px;

  padding:12px;

  border:0;

  border-radius:10px;

  background:#304967;

  color:white;
}

.close{
  background:#663b3b !important;
}


/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

  #viewport,
  #hud{
    width:700px;

    left:50%;

    transform:
      translateX(-50%);
  }

  #battle{
    width:700px;

    left:50%;
    right:auto;
  }

}
</style>
</head>


<body>

<header id="hud">

  <div id="title">
    🌱 勇者そらまめ
  </div>

  <div class="stats">

    <div class="stat">
      Lv.<span id="level">1</span>
    </div>

    <div class="stat">
      💰 <span id="gold">0</span>
    </div>

  </div>

</header>


<!-- =========================
     FIELD
========================= -->

<div id="viewport">

  <div id="world">

    <div class="road horizontal"></div>

    <div class="road vertical"></div>

    <div class="water"></div>

    <div class="village"></div>


    <div class="tree t1"></div>
    <div class="tree t2"></div>
    <div class="tree t3"></div>
    <div class="tree t4"></div>
    <div class="tree t5"></div>
    <div class="tree t6"></div>


    <div class="rock r1"></div>
    <div class="rock r2"></div>
    <div class="rock r3"></div>


    <button
      class="stage"
      id="stage1">

      🚪 ステージ1

      <small>
        山道
      </small>

    </button>


    <div id="player">

      <div id="hero">
        🧑‍🌾
      </div>

      <div id="playerName">
        そらまめ
      </div>

      <div id="marker">
        🌱
      </div>

    </div>

  </div>

</div>


<div id="message">
  👣 フィールドを探索しよう！
</div>


<!-- =========================
     CONTROLS
========================= -->

<div id="controls">

  <button
    class="control"
    id="up">
    ▲
  </button>

  <button
    class="control"
    id="left">
    ◀
  </button>

  <button
    class="control"
    id="right">
    ▶
  </button>

  <button
    class="control"
    id="down">
    ▼
  </button>

</div>


<button id="worldButton">
  🌎
</button>


<!-- =========================================================
     BATTLE
========================================================= -->

<div id="battle">

  <div class="battleScene">

    <div class="battleGlow"></div>


    <div class="battleTop">

      <div class="enemyInfo">

        <b id="enemyName">
          グリーンスライム
        </b>

        <div class="enemyHP">

          <i id="enemyHPBar"></i>

        </div>

        <small>
          HP
          <span id="enemyHPText">
            30 / 30
          </span>
        </small>

      </div>


      <div
        class="battleNotice"
        id="battleNotice">

        ⚔️ 敵が現れた！

      </div>

    </div>


    <button id="autoBtn">
      オート: OFF
    </button>


    <div
      class="enemySprite"
      id="enemyIcon">

      👾

    </div>


    <div id="damage"></div>


    <div
      class="turn"
      id="turnText">

      そらまめのターン

    </div>


    <!-- PARTY -->

    <div class="party">


      <div
        class="heroCard active"
        id="p1">

        <div class="heroSprite">
          🧑‍🌾
        </div>

        <b>
          そらまめ
        </b>

        <div class="miniHP">
          <i id="p1hp"></i>
        </div>

      </div>


      <div
        class="heroCard"
        id="p2">

        <div class="heroSprite">
          🛡️
        </div>

        <b>
          えんどう
        </b>

        <div class="miniHP">
          <i id="p2hp"></i>
        </div>

      </div>


      <div
        class="heroCard"
        id="p3">

        <div class="heroSprite">
          🧙
        </div>

        <b>
          えだまめ
        </b>

        <div class="miniHP">
          <i id="p3hp"></i>
        </div>

      </div>

    </div>


    <!-- COMMAND -->

    <div class="battleUI">

      <div class="command">

        <button
          class="cmd attack"
          data-act="attack">

          ⚔️ こうげき

        </button>


        <button
          class="cmd magic"
          data-act="magic">

          ✨ スキル

        </button>


        <button
          class="cmd"
          data-act="guard">

          🛡️ ぼうぎょ

        </button>


        <button
          class="cmd"
          data-act="escape">

          🏃 にげる

        </button>

      </div>


      <div
        class="log"
        id="battleLog">

        敵を見据えている……

        <br>

        <strong>
          どうする？
        </strong>

      </div>

    </div>


    <button id="battleClose">
      フィールドへ戻る
    </button>

  </div>

</div>


<!-- =========================
     WORLD PANEL
========================= -->

<div id="worldPanel">

  <div class="panel">

    <h2>
      🌎 世界移動
    </h2>

    <p>
      行き先を選択
    </p>


    <button id="surfaceSave">
      🌱 表世界・セーブポイント
    </button>


    <button id="underSave">
      🌑 裏世界・セーブポイント
    </button>


    <button
      class="close"
      id="closeWorld">

      閉じる

    </button>

  </div>

</div>


<script>

/* =====================================================
   GAME DATA
===================================================== */

const game = {

  level:1,

  gold:0,

  battle:false,

  steps:0,

  player:{

    x:1200,

    y:900

  },

  camera:{

    x:0,

    y:0

  },

  enemy:{

    hp:30,

    maxHp:30,

    name:""

  },

  auto:false,

  party:[

    100,
    100,
    100

  ]

};


/* =====================================================
   SHORTCUT
===================================================== */

const $ = id =>
  document.getElementById(id);


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

  $("level").textContent =
    game.level;

  $("gold").textContent =
    game.gold;

}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

  const width =
    $("viewport").clientWidth;

  const height =
    $("viewport").clientHeight;


  let cameraX =
    game.player.x -
    width / 2;

  let cameraY =
    game.player.y -
    height / 2;


  cameraX =
    Math.max(
      0,
      Math.min(
        cameraX,
        2400 - width
      )
    );


  cameraY =
    Math.max(
      0,
      Math.min(
        cameraY,
        1800 - height
      )
    );


  game.camera.x =
    cameraX;

  game.camera.y =
    cameraY;


  $("world").style.transform =
    `translate(${-cameraX}px,${-cameraY}px)`;


  $("player").style.left =
    (game.player.x - cameraX) +
    "px";


  $("player").style.top =
    (game.player.y - cameraY) +
    "px";

}


/* =====================================================
   MOVE
===================================================== */

function move(direction){

  if(game.battle)
    return;


  const speed = 12;


  if(direction === "up")
    game.player.y -= speed;


  if(direction === "down")
    game.player.y += speed;


  if(direction === "left")
    game.player.x -= speed;


  if(direction === "right")
    game.player.x += speed;


  game.player.x =
    Math.max(
      40,
      Math.min(
        2360,
        game.player.x
      )
    );


  game.player.y =
    Math.max(
      40,
      Math.min(
        1760,
        game.player.y
      )
    );


  updateCamera();


  $("player").animate(

    [

      {
        transform:
          "translate(-50%,-50%) translateY(0)"
      },

      {
        transform:
          "translate(-50%,-50%) translateY(-7px)"
      },

      {
        transform:
          "translate(-50%,-50%) translateY(0)"
      }

    ],

    {
      duration:150
    }

  );


  game.steps++;


  if(
    game.steps >= 15 &&
    Math.random() < 0.035
  ){

    game.steps = 0;

    encounter();

  }

}


/* =====================================================
   CONTROLS
===================================================== */

function bindControl(
  id,
  direction
){

  $(id).addEventListener(

    "pointerdown",

    event => {

      event.preventDefault();

      event.stopPropagation();

      move(direction);

    },

    {
      passive:false
    }

  );

}


bindControl("up","up");
bindControl("down","down");
bindControl("left","left");
bindControl("right","right");


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(

  "keydown",

  event => {

    const keys = {

      ArrowUp:"up",
      ArrowDown:"down",
      ArrowLeft:"left",
      ArrowRight:"right"

    };


    const direction =
      keys[event.key];


    if(direction){

      event.preventDefault();

      move(direction);

    }

  }

);


/* =====================================================
   ENEMIES
===================================================== */

const enemies = [

  [
    "👾",
    "グリーンスライム",
    30
  ],

  [
    "🐺",
    "ワイルドウルフ",
    40
  ],

  [
    "🦇",
    "ダークバット",
    35
  ],

  [
    "🌵",
    "サンドプラント",
    45
  ]

];


/* =====================================================
   ENCOUNTER
===================================================== */

function encounter(){

  const enemy =
    enemies[
      Math.floor(
        Math.random() *
        enemies.length
      )
    ];


  startBattle(

    enemy[0],
    enemy[1],
    enemy[2],

    "⚔️ 不意に魔物が飛び出した！"

  );

}


/* =====================================================
   START BATTLE
===================================================== */

function startBattle(
  icon,
  name,
  hp,
  notice
){

  game.battle =
    true;


  game.enemy = {

    hp:hp,

    maxHp:hp,

    name:name

  };


  $("enemyIcon").textContent =
    icon;

  $("enemyName").textContent =
    name;

  $("battleNotice").textContent =
    notice;


  $("battleClose").style.display =
    "none";


  $("enemyIcon").classList.remove(
    "defeat"
  );

  $("enemyIcon").style.opacity =
    "1";


  updateEnemy();


  $("battle").style.display =
    "block";


  requestAnimationFrame(() => {

    $("battle").classList.add(
      "show"
    );

  });


  log(
    "敵の様子をうかがっている……",
    "どうする？"
  );


  setActive(0);

}


/* =====================================================
   ENEMY HP
===================================================== */

function updateEnemy(){

  const percent =
    Math.max(
      0,
      game.enemy.hp /
      game.enemy.maxHp *
      100
    );


  $("enemyHPBar").style.width =
    percent + "%";


  $("enemyHPText").textContent =

    game.enemy.hp +
    " / " +
    game.enemy.maxHp;

}


/* =====================================================
   BATTLE LOG
===================================================== */

function log(
  first,
  second = ""
){

  $("battleLog").innerHTML =

    first +

    (
      second
      ?
      `<br><strong>${second}</strong>`
      :
      ""
    );

}


/* =====================================================
   ACTIVE PARTY
===================================================== */

function setActive(index){

  document
    .querySelectorAll(".heroCard")
    .forEach(
      (card,i) => {

        card.classList.toggle(
          "active",
          i === index
        );

      }
    );

}


/* =====================================================
   DAMAGE EFFECT
===================================================== */

function damagePop(
  damage
){

  const damageElement =
    $("damage");


  damageElement.textContent =
    damage;


  damageElement.className =
    "";


  void damageElement.offsetWidth;


  damageElement.className =
    "damagePop";


  const enemy =
    $("enemyIcon");


  enemy.classList.remove(
    "hit"
  );


  void enemy.offsetWidth;


  enemy.classList.add(
    "hit"
  );

}


/* =====================================================
   ENEMY TURN
===================================================== */

function enemyTurn(){

  if(
    game.enemy.hp <= 0
  )
    return;


  setActive(1);


  $("turnText").textContent =
    "敵のターン……";


  setTimeout(() => {

    const target =
      Math.floor(
        Math.random() * 3
      );


    const damage =
      5 +
      Math.floor(
        Math.random() * 8
      );


    game.party[target] =
      Math.max(
        0,
        game.party[target] -
        damage
      );


    $(
      "p" +
      (target + 1) +
      "hp"
    ).style.width =
      game.party[target] +
      "%";


    const names = [

      "そらまめ",
      "えんどう",
      "えだまめ"

    ];


    log(

      `${game.enemy.name}の攻撃！`,

      `${names[target]}に ${damage} ダメージ！`

    );


    setTimeout(() => {

      setActive(0);

      $("turnText").textContent =
        "そらまめのターン";


      if(game.auto){

        autoAttack();

      }

    },500);

  },650);

}


/* =====================================================
   PLAYER ACTION
===================================================== */

function playerAction(
  action
){

  if(
    !game.battle ||
    game.enemy.hp <= 0
  )
    return;


  setActive(0);


  /* 逃走 */

  if(action === "escape"){

    if(
      Math.random() < 0.65
    ){

      log(
        "🏃 うまく逃げ切った！"
      );


      setTimeout(
        closeBattle,
        500
      );

    }
    else{

      log(
        "逃げられない！",
        "敵のターン！"
      );


      enemyTurn();

    }


    return;

  }


  /* 防御 */

  if(action === "guard"){

    log(
      "🛡️ そらまめは身を守った！",
      "次の攻撃を軽減"
    );


    setTimeout(
      enemyTurn,
      500
    );


    return;

  }


  /* 攻撃 */

  const damage =

    action === "magic"

    ?

    12 +
    Math.floor(
      Math.random() * 9
    )

    :

    8 +
    Math.floor(
      Math.random() * 9
    );


  game.enemy.hp =
    Math.max(
      0,
      game.enemy.hp -
      damage
    );


  updateEnemy();


  damagePop(
    damage
  );


  log(

    `そらまめの${
      action === "magic"
      ? "スキル"
      : "攻撃"
    }！`,

    `${damage} ダメージ！`

  );


  /* 撃破 */

  if(
    game.enemy.hp <= 0
  ){

    $("turnText").textContent =
      "勝利！";


    $("enemyIcon").classList.add(
      "defeat"
    );


    game.gold += 30;


    updateHUD();


    log(
      "🎉 魔物を倒した！",
      "+30 G"
    );


    $("battleClose").style.display =
      "block";


    return;

  }


  setTimeout(
    enemyTurn,
    500
  );

}


/* =====================================================
   COMMAND BUTTONS
===================================================== */

document
  .querySelectorAll(".cmd")
  .forEach(
    button => {

      button.addEventListener(

        "pointerdown",

        event => {

          event.preventDefault();

          playerAction(
            button.dataset.act
          );

        }

      );

    }
  );


/* =====================================================
   AUTO
===================================================== */

function autoAttack(){

  if(
    !game.battle
  )
    return;


  playerAction(

    Math.random() < 0.25
    ?
    "magic"
    :
    "attack"

  );

}


$("autoBtn").addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();


    game.auto =
      !game.auto;


    $("autoBtn").textContent =

      `オート: ${
        game.auto
        ? "ON"
        : "OFF"
      }`;


    if(game.auto){

      autoAttack();

    }

  }

);


/* =====================================================
   CLOSE BATTLE
===================================================== */

function closeBattle(){

  $("battle").classList.remove(
    "show"
  );


  setTimeout(() => {

    $("battle").style.display =
      "none";


    game.battle =
      false;


    game.auto =
      false;


    $("autoBtn").textContent =
      "オート: OFF";


    $("enemyIcon").classList.remove(
      "defeat"
    );


    $("enemyIcon").style.opacity =
      "1";


    $("turnText").textContent =
      "そらまめのターン";

  },350);

}


$("battleClose").addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();

    closeBattle();

  }

);

/* =====================================================
   MESSAGE
===================================================== */

let messageTimer;


function showMessage(
  text
){

  $("message").textContent =
    text;


  clearTimeout(
    messageTimer
  );


  messageTimer =
    setTimeout(() => {

      $("message").textContent =
        "👣 フィールドを探索しよう！";

    },1800);

}


/* =====================================================
   MOBILE ZOOM PREVENT
===================================================== */

let lastTouch = 0;


document.addEventListener(

  "touchend",

  event => {

    const now =
      Date.now();


    if(
      now -
      lastTouch <
      350
    ){

      event.preventDefault();

    }


    lastTouch =
      now;

  },

  {
    passive:false
  }

);


document.addEventListener(

  "touchmove",

  event => {

    if(
      event.touches.length > 1
    ){

      event.preventDefault();

    }

  },

  {
    passive:false
  }

);


[
  "gesturestart",
  "gesturechange",
  "gestureend"

].forEach(
  type => {

    document.addEventListener(

      type,

      event => {

        event.preventDefault();

      },

      {
        passive:false
      }

    );

  }
);

   START
===================================================== */

window.addEventListener(
  "resize",
  updateCamera
);


updateHUD();

updateCamera();
