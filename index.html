<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no">

<title>勇者そらまめ</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#172033;
  font-family:sans-serif;
  touch-action:none;
}

/* =========================
   HUD
========================= */

#hud{
  position:fixed;
  z-index:100;
  top:0;
  left:0;
  width:100%;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 12px;
  color:white;
  background:#101827;
  border-bottom:2px solid #4d6380;
}

#title{
  font-size:15px;
  font-weight:bold;
}

.stats{
  display:flex;
  gap:7px;
}

.stat{
  padding:6px 9px;
  border-radius:10px;
  background:#202e46;
  border:1px solid #596d8d;
  font-size:13px;
  font-weight:bold;
}

/* =========================
   VIEWPORT
========================= */

#viewport{
  position:absolute;
  left:0;
  top:58px;
  width:100%;
  height:calc(100% - 58px);
  overflow:hidden;
  background:#376e37;
}

/* =========================
   WORLD
========================= */

#world{
  position:absolute;
  width:2400px;
  height:1800px;
  left:0;
  top:0;
  transform-origin:0 0;
  will-change:transform;
}

/* 草原 */

#world{
  background-color:#376e37;

  background-image:
    radial-gradient(
      rgba(255,255,255,.08)
      1px,
      transparent 1px
    );

  background-size:35px 35px;
}

/* =========================
   MAP
========================= */

.road{
  position:absolute;
  background:#927247;
  border:6px solid #765a37;
  border-radius:35px;
}

.road.horizontal{
  left:-100px;
  top:760px;
  width:2600px;
  height:190px;
}

.road.vertical{
  left:1120px;
  top:-100px;
  width:190px;
  height:2000px;
}

.water{
  position:absolute;
  left:1450px;
  top:170px;
  width:650px;
  height:390px;

  background:#286f88;
  border:7px solid #1d5367;
  border-radius:50px;
}

.village{
  position:absolute;
  left:220px;
  top:700px;
  width:300px;
  height:230px;

  background:#548d43;
  border:5px solid #3d6e34;
  border-radius:30px;
}

/* =========================
   TREES
========================= */

.tree{
  position:absolute;
  width:70px;
  height:70px;

  border-radius:50%;
  background:#28612f;
  border:8px solid #1c4824;

  box-shadow:
    inset 0 0 0 5px #3d8140;
}

.tree:after{
  content:"";
  position:absolute;

  left:22px;
  top:58px;

  width:18px;
  height:32px;

  background:#704a2b;

  z-index:-1;
}

.t1{
  left:300px;
  top:260px;
}

.t2{
  left:700px;
  top:420px;
}

.t3{
  left:830px;
  top:1280px;
}

.t4{
  left:1660px;
  top:1040px;
}

.t5{
  left:2050px;
  top:1330px;
}

.t6{
  left:1900px;
  top:260px;
}

/* =========================
   ROCKS
========================= */

.rock{
  position:absolute;

  width:60px;
  height:42px;

  border-radius:50%;

  background:#6b7279;
  border:4px solid #4d5359;
}

.r1{
  left:600px;
  top:1080px;
}

.r2{
  left:1500px;
  top:800px;
}

.r3{
  left:2050px;
  top:700px;
}

/* =========================
   STAGE
========================= */

.stage{
  position:absolute;
  z-index:10;

  width:140px;
  min-height:65px;

  padding:10px;

  border-radius:16px;

  background:#43251c;
  border:3px solid #aa694a;

  color:white;

  font-weight:bold;
  text-align:center;

  box-shadow:
    0 6px 15px rgba(0,0,0,.35);
}

.stage small{
  display:block;
  margin-top:4px;
  font-size:11px;
  opacity:.75;
}

#stage1{
  left:1350px;
  top:650px;
}

/* =========================
   PLAYER
========================= */

#player{
  position:absolute;

  z-index:50;

  width:80px;
  height:90px;

  pointer-events:none;

  transform:translate(-50%,-50%);
}

#hero{
  text-align:center;
  font-size:44px;
  line-height:50px;
}

#playerName{
  display:block;

  width:max-content;

  margin:auto;

  padding:3px 9px;

  border-radius:10px;

  background:#111;
  color:white;

  font-size:12px;
  font-weight:bold;
}

#marker{
  text-align:center;
  font-size:20px;
}

/* =========================
   MESSAGE
========================= */

#message{
  position:fixed;

  z-index:80;

  left:50%;
  top:70px;

  transform:translateX(-50%);

  width:max-content;
  max-width:90%;

  padding:7px 12px;

  border-radius:12px;

  background:rgba(15,40,20,.88);
  color:#d9ffd9;

  font-size:12px;

  pointer-events:none;
}

/* =========================
   CONTROLS
========================= */

#controls{
  position:fixed;

  z-index:90;

  left:15px;
  bottom:18px;

  width:175px;
  height:175px;
}

.control{
  position:absolute;

  width:56px;
  height:56px;

  border-radius:14px;

  border:2px solid #617895;

  background:#1d304d;

  color:white;

  font-size:24px;

  box-shadow:
    0 5px 10px rgba(0,0,0,.3);
}

.control:active{
  background:#3a587e;
  transform:scale(.93);
}

#up{
  left:59px;
  top:0;
}

#left{
  left:0;
  top:59px;
}

#right{
  right:0;
  top:59px;
}

#down{
  left:59px;
  bottom:0;
}

/* =========================
   WORLD BUTTON
========================= */

#worldButton{
  position:fixed;

  z-index:90;

  right:15px;
  bottom:85px;

  width:58px;
  height:58px;

  border-radius:50%;

  border:2px solid #647b9c;

  background:#1d304d;

  color:white;

  font-size:22px;
}

/* =========================
   BATTLE
========================= */

#battle{
  position:fixed;

  z-index:200;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  background:rgba(4,7,14,0);

  opacity:0;

  transition:
    opacity .45s,
    background .45s;
}

#battle.show{
  opacity:1;
  background:rgba(4,7,14,.94);
}

.battleBox{
  width:min(90%,430px);

  padding:25px;

  border-radius:20px;

  background:#18243a;

  border:2px solid #667b9c;

  color:white;

  text-align:center;

  box-shadow:
    0 10px 40px rgba(0,0,0,.5);
}

.enemy{
  font-size:75px;
  margin:10px;
}

.enemyName{
  font-size:18px;
  font-weight:bold;
}

.hp{
  height:18px;

  margin:12px 0;

  border-radius:10px;

  overflow:hidden;

  background:#3a1919;
}

.hpBar{
  width:100%;
  height:100%;

  background:#df4d4d;

  transition:width .25s;
}

.attack{
  width:100%;

  margin-top:15px;

  padding:13px;

  border:0;

  border-radius:12px;

  background:#cf6638;

  color:white;

  font-weight:bold;
}

/* =========================
   WORLD MOVE PANEL
========================= */

#worldPanel{
  position:fixed;

  z-index:300;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.7);
}

.panel{
  width:85%;
  max-width:350px;

  padding:22px;

  border-radius:18px;

  background:#17243a;

  border:2px solid #657b9c;

  color:white;

  text-align:center;
}

.panel button{
  width:100%;

  margin-top:10px;

  padding:12px;

  border:0;

  border-radius:10px;

  background:#304967;

  color:white;
}

.close{
  background:#663b3b !important;
}

/* =========================
   RESPONSIVE
========================= */

@media(min-width:700px){

  #viewport{
    width:700px;
    left:50%;
    transform:translateX(-50%);
  }

  #hud{
    width:700px;
    left:50%;
    transform:translateX(-50%);
  }
}
</style>
</head>

<body>

<header id="hud">

  <div id="title">
    🌱 勇者そらまめ
  </div>

  <div class="stats">

    <div class="stat">
      Lv.<span id="level">1</span>
    </div>

    <div class="stat">
      💰 <span id="gold">0</span>
    </div>

  </div>

</header>


<div id="viewport">

  <div id="world">

    <!-- 地形 -->

    <div class="road horizontal"></div>
    <div class="road vertical"></div>

    <div class="water"></div>
    <div class="village"></div>


    <!-- 木 -->

    <div class="tree t1"></div>
    <div class="tree t2"></div>
    <div class="tree t3"></div>
    <div class="tree t4"></div>
    <div class="tree t5"></div>
    <div class="tree t6"></div>


    <!-- 岩 -->

    <div class="rock r1"></div>
    <div class="rock r2"></div>
    <div class="rock r3"></div>


    <!-- ステージ -->

    <button class="stage" id="stage1">

      🚪 ステージ1

      <small>
        山道
      </small>

    </button>


    <!-- プレイヤー -->

    <div id="player">

      <div id="hero">
        🧑‍🌾
      </div>

      <div id="playerName">
        そらまめ
      </div>

      <div id="marker">
        🌱
      </div>

    </div>

  </div>

</div>


<div id="message">
  👣 フィールドを探索しよう！
</div>


<!-- 十字キー -->

<div id="controls">

  <button class="control" id="up">
    ▲
  </button>

  <button class="control" id="left">
    ◀
  </button>

  <button class="control" id="right">
    ▶
  </button>

  <button class="control" id="down">
    ▼
  </button>

</div>


<button id="worldButton">
  🌎
</button>


<!-- =========================
     BATTLE
========================= -->

<div id="battle">

  <div class="battleBox">

    <h2>
      ⚔️ 敵が現れた！
    </h2>

    <div class="enemy" id="enemyIcon">
      👾
    </div>

    <div class="enemyName" id="enemyName">
      スライム
    </div>

    <div class="hp">

      <div
        class="hpBar"
        id="enemyHPBar">
      </div>

    </div>

    <div>
      HP:
      <span id="enemyHPText">
        30 / 30
      </span>
    </div>

    <button
      class="attack"
      id="attackButton">

      ⚔️ こうげき

    </button>

  </div>

</div>


<!-- =========================
     WORLD MOVE
========================= -->

<div id="worldPanel">

  <div class="panel">

    <h2>
      🌎 世界移動
    </h2>

    <p>
      行き先を選択
    </p>

    <button id="surfaceSave">
      🌱 表世界・セーブポイント
    </button>

    <button id="underSave">
      🌑 裏世界・セーブポイント
    </button>

    <button
      class="close"
      id="closeWorld">

      閉じる

    </button>

  </div>

</div>


<script>

/* =====================================================
   GAME
===================================================== */

const game = {

  level:1,

  gold:0,

  battle:false,

  steps:0,

  player:{

    /*
      ワールド座標。

      ここが今回の重要部分。

      プレイヤーは世界の中に存在する。
      カメラがプレイヤーを見る。
    */

    x:1200,

    y:900

  },

  camera:{

    x:0,

    y:0

  },

  enemy:{

    hp:30,

    maxHp:30

  }

};


/* =====================================================
   ELEMENTS
===================================================== */

const viewport =
  document.getElementById("viewport");

const world =
  document.getElementById("world");

const player =
  document.getElementById("player");

const battle =
  document.getElementById("battle");


/* =====================================================
   UPDATE HUD
===================================================== */

function updateHUD(){

  document.getElementById("level")
    .textContent = game.level;

  document.getElementById("gold")
    .textContent = game.gold;

}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

  const width =
    viewport.clientWidth;

  const height =
    viewport.clientHeight;


  /*
    プレイヤーを画面中央へ。

    ワールド自体は巨大な固定マップ。

    ここでは「カメラ位置」を変更して
    ワールドを表示している。
  */

  game.camera.x =
    game.player.x - width / 2;

  game.camera.y =
    game.player.y - height / 2;


  /* マップ端 */

  game.camera.x =
    Math.max(
      0,
      Math.min(
        game.camera.x,
        2400 - width
      )
    );


  game.camera.y =
    Math.max(
      0,
      Math.min(
        game.camera.y,
        1800 - height
      )
    );


  world.style.transform =
    `translate(${-game.camera.x}px,${-game.camera.y}px)`;


  /*
    プレイヤーの画面位置。

    カメラ端では中央から少しズレる。
  */

  player.style.left =
    (game.player.x - game.camera.x) + "px";

  player.style.top =
    (game.player.y - game.camera.y) + "px";

}


/* =====================================================
   MOVE
===================================================== */

function move(direction){

  if(game.battle)
    return;


  const speed = 12;


  if(direction === "up")
    game.player.y -= speed;

  if(direction === "down")
    game.player.y += speed;

  if(direction === "left")
    game.player.x -= speed;

  if(direction === "right")
    game.player.x += speed;


  /*
    ワールドから出ない
  */

  game.player.x =
    Math.max(
      40,
      Math.min(
        2360,
        game.player.x
      )
    );


  game.player.y =
    Math.max(
      40,
      Math.min(
        1760,
        game.player.y
      )
    );


  updateCamera();


  /* 歩行アニメーション */

  player.animate(

    [
      {
        transform:
          "translate(-50%,-50%) translateY(0)"
      },

      {
        transform:
          "translate(-50%,-50%) translateY(-7px)"
      },

      {
        transform:
          "translate(-50%,-50%) translateY(0)"
      }
    ],

    {
      duration:150,
      easing:"ease-out"
    }

  );


  game.steps++;


  /*
    エンカウント。

    最低15歩歩いてから。

    その後は6%。
  */

  if(
    game.steps >= 15 &&
    Math.random() < 0.06
  ){

    game.steps = 0;

    encounter();

  }

}


/* =====================================================
   CONTROLS
===================================================== */

function bindControl(
  id,
  direction
){

  const button =
    document.getElementById(id);


  button.addEventListener(

    "pointerdown",

    event => {

      event.preventDefault();
      event.stopPropagation();

      move(direction);

    },

    {
      passive:false
    }

  );

}


bindControl("up","up");
bindControl("down","down");
bindControl("left","left");
bindControl("right","right");


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
  "keydown",
  event => {

    const keys = {

      ArrowUp:"up",
      ArrowDown:"down",
      ArrowLeft:"left",
      ArrowRight:"right"

    };


    if(keys[event.key]){

      event.preventDefault();

      move(keys[event.key]);

    }

  }
);


/* =====================================================
   ENCOUNTER
===================================================== */

function encounter(){

  game.battle = true;


  const enemies = [

    {
      icon:"👾",
      name:"グリーンスライム",
      hp:30
    },

    {
      icon:"🐺",
      name:"ワイルドウルフ",
      hp:40
    },

    {
      icon:"🦇",
      name:"ダークバット",
      hp:35
    }

  ];


  const enemy =
    enemies[
      Math.floor(
        Math.random() * enemies.length
      )
    ];


  game.enemy.maxHp =
    enemy.hp;

  game.enemy.hp =
    enemy.hp;


  document.getElementById(
    "enemyIcon"
  ).textContent =
    enemy.icon;


  document.getElementById(
    "enemyName"
  ).textContent =
    enemy.name;


  updateEnemy();


  /*
    フェードイン
  */

  battle.style.display =
    "flex";


  requestAnimationFrame(() => {

    battle.classList.add("show");

  });

}


/* =====================================================
   ENEMY
===================================================== */

function updateEnemy(){

  const percent =
    Math.max(
      0,
      game.enemy.hp /
      game.enemy.maxHp *
      100
    );


  document.getElementById(
    "enemyHPBar"
  ).style.width =
    percent + "%";


  document.getElementById(
    "enemyHPText"
  ).textContent =

    game.enemy.hp +
    " / " +
    game.enemy.maxHp;

}


/* =====================================================
   ATTACK
===================================================== */

document.getElementById(
  "attackButton"
)
.addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();


    if(!game.battle)
      return;


    const damage =
      8 +
      Math.floor(
        Math.random() * 9
      );


    game.enemy.hp -=
      damage;


    if(game.enemy.hp <= 0){

      game.enemy.hp = 0;

      updateEnemy();


      setTimeout(() => {

        game.gold += 30;

        updateHUD();

        closeBattle();

      },500);


      return;

    }


    updateEnemy();

  }

);


/* =====================================================
   CLOSE BATTLE
===================================================== */

function closeBattle(){

  battle.classList.remove("show");


  setTimeout(() => {

    battle.style.display =
      "none";

    game.battle = false;

  },450);

}


/* =====================================================
   STAGE
===================================================== */

document.getElementById(
  "stage1"
)
.addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();

    if(game.battle)
      return;


    /*
      ステージ1では
      とりあえず固定ボス戦。
    */

    game.battle = true;


    game.enemy.maxHp = 60;
    game.enemy.hp = 60;


    document.getElementById(
      "enemyIcon"
    ).textContent =
      "👹";


    document.getElementById(
      "enemyName"
    ).textContent =
      "山道の魔物";


    updateEnemy();


    battle.style.display =
      "flex";


    requestAnimationFrame(() => {

      battle.classList.add("show");

    });

  }

);


/* =====================================================
   WORLD MOVE
===================================================== */

const worldPanel =
  document.getElementById(
    "worldPanel"
  );


document.getElementById(
  "worldButton"
)
.addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();

    worldPanel.style.display =
      "flex";

  }

);


/* 閉じる */

document.getElementById(
  "closeWorld"
)
.addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();

    worldPanel.style.display =
      "none";

  }

);


/*
  まだ試作なので、
  セーブポイントを押したら
  パネルを閉じるだけ。
*/

document.getElementById(
  "surfaceSave"
)
.addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();

    worldPanel.style.display =
      "none";

    showMessage(
      "🌱 表世界のセーブポイントへ！"
    );

  }

);


document.getElementById(
  "underSave"
)
.addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();

    worldPanel.style.display =
      "none";

    showMessage(
      "🌑 裏世界のセーブポイントへ！"
    );

  }

);


/* =====================================================
   MESSAGE
===================================================== */

let messageTimer;

function showMessage(text){

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  clearTimeout(messageTimer);


  messageTimer =
    setTimeout(() => {

      message.textContent =
        "👣 フィールドを探索しよう！";

    },1800);

}


/* =====================================================
   SAFARI / MOBILE
===================================================== */

/*
  ダブルタップズーム防止
*/

let lastTouch = 0;

document.addEventListener(

  "touchend",

  event => {

    const now =
      Date.now();


    if(
      now - lastTouch <
      350
    ){

      event.preventDefault();

    }


    lastTouch = now;

  },

  {
    passive:false
  }

);


/*
  ピンチズーム防止
*/

document.addEventListener(

  "touchmove",

  event => {

    if(
      event.touches.length > 1
    ){

      event.preventDefault();

    }

  },

  {
    passive:false
  }

);


/*
  Safariジェスチャー防止
*/

[
  "gesturestart",
  "gesturechange",
  "gestureend"
].forEach(type => {

  document.addEventListener(

    type,

    event =>
      event.preventDefault(),

    {
      passive:false
    }

  );

});


/* =====================================================
   START
===================================================== */

window.addEventListener(
  "resize",
  updateCamera
);

updateHUD();
updateCamera();

</script>

</body>
</html>
