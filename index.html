<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               minimum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>勇者そらまめ</title>

<style>

/* =====================================================
   BASIC
===================================================== */

*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  min-height:100%;
  overflow:hidden;

  background:#101827;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  touch-action:none;
  overscroll-behavior:none;
}

button{
  font-family:inherit;
  -webkit-user-select:none;
  user-select:none;
  touch-action:manipulation;
}


/* =====================================================
   HUD
===================================================== */

#hud{
  position:fixed;
  z-index:1000;

  top:0;
  left:0;

  width:100%;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    env(safe-area-inset-top)
    12px
    8px
    12px;

  color:white;
  background:#101827;

  border-bottom:2px solid #4d6380;
}

#title{
  font-size:15px;
  font-weight:bold;
}

.stats{
  display:flex;
  gap:7px;
}

.stat{
  padding:6px 9px;

  border-radius:10px;

  background:#202e46;
  border:1px solid #596d8d;

  font-size:13px;
  font-weight:bold;
}


/* =====================================================
   VIEWPORT
===================================================== */

#viewport{
  position:fixed;

  left:0;
  top:58px;

  width:100%;
  height:calc(100dvh - 58px);

  overflow:hidden;

  background:#376e37;

  touch-action:none;
}


/* =====================================================
   WORLD
===================================================== */

#world{
  position:absolute;

  left:0;
  top:0;

  width:2400px;
  height:1800px;

  transform-origin:0 0;

  will-change:transform;

  background-color:#376e37;

  background-image:
    radial-gradient(
      rgba(255,255,255,.08) 1px,
      transparent 1px
    );

  background-size:35px 35px;
}


/* =====================================================
   ROAD
===================================================== */

.road{
  position:absolute;

  background:#927247;

  border:6px solid #765a37;

  border-radius:35px;
}

.road.horizontal{
  left:-100px;
  top:760px;

  width:2600px;
  height:190px;
}

.road.vertical{
  left:1120px;
  top:-100px;

  width:190px;
  height:2000px;
}


/* =====================================================
   WATER
===================================================== */

.water{
  position:absolute;

  left:1450px;
  top:170px;

  width:650px;
  height:390px;

  background:#286f88;

  border:7px solid #1d5367;

  border-radius:50px;
}


/* =====================================================
   VILLAGE
===================================================== */

.village{
  position:absolute;

  left:220px;
  top:700px;

  width:300px;
  height:230px;

  background:#548d43;

  border:5px solid #3d6e34;

  border-radius:30px;
}


/* =====================================================
   TREES
===================================================== */

.tree{
  position:absolute;

  width:70px;
  height:70px;

  border-radius:50%;

  background:#28612f;

  border:8px solid #1c4824;

  box-shadow:
    inset 0 0 0 5px #3d8140;
}

.tree::after{
  content:"";

  position:absolute;

  left:22px;
  top:58px;

  width:18px;
  height:32px;

  background:#704a2b;

  z-index:-1;
}

.t1{
  left:300px;
  top:260px;
}

.t2{
  left:700px;
  top:420px;
}

.t3{
  left:830px;
  top:1280px;
}

.t4{
  left:1660px;
  top:1040px;
}

.t5{
  left:2050px;
  top:1330px;
}

.t6{
  left:1900px;
  top:260px;
}


/* =====================================================
   ROCKS
===================================================== */

.rock{
  position:absolute;

  width:60px;
  height:42px;

  border-radius:50%;

  background:#6b7279;

  border:4px solid #4d5359;
}

.r1{
  left:600px;
  top:1080px;
}

.r2{
  left:1500px;
  top:800px;
}

.r3{
  left:2050px;
  top:700px;
}


/* =====================================================
   STAGE
===================================================== */

.stage{
  position:absolute;

  z-index:20;

  width:140px;
  min-height:65px;

  padding:10px;

  border-radius:16px;

  background:#43251c;

  border:3px solid #aa694a;

  color:white;

  font-size:16px;
  font-weight:bold;

  text-align:center;

  box-shadow:
    0 6px 15px rgba(0,0,0,.35);

  cursor:pointer;
}

.stage small{
  display:block;

  margin-top:4px;

  font-size:11px;

  opacity:.75;
}

.stage:active{
  transform:scale(.96);
}

#stage1{
  left:1350px;
  top:650px;
}


/* =====================================================
   PLAYER
===================================================== */

/*
  ★重要

  playerはworldの中に存在する。

  カメラ移動時にworldだけを動かすので、
  playerをさらに画面座標へ移動させない。

  これで「二重移動」がなくなる。
*/

#player{
  position:absolute;

  z-index:100;

  width:80px;
  height:95px;

  left:1200px;
  top:900px;

  transform:
    translate(-50%,-50%);

  pointer-events:none;

  text-align:center;

  will-change:transform;
}

#hero{
  font-size:44px;

  line-height:50px;

  filter:
    drop-shadow(
      0 3px 3px
      rgba(0,0,0,.35)
    );
}

#playerName{
  display:block;

  width:max-content;

  margin:auto;

  padding:3px 9px;

  border-radius:10px;

  background:#111;

  color:white;

  font-size:12px;

  font-weight:bold;

  white-space:nowrap;
}

#marker{
  text-align:center;

  font-size:20px;

  line-height:20px;
}


/* =====================================================
   MESSAGE
===================================================== */

#message{
  position:fixed;

  z-index:900;

  left:50%;
  top:70px;

  transform:translateX(-50%);

  width:max-content;

  max-width:90%;

  padding:7px 12px;

  border-radius:12px;

  background:rgba(15,40,20,.88);

  color:#d9ffd9;

  font-size:12px;

  pointer-events:none;

  white-space:nowrap;
}


/* =====================================================
   CONTROLS
===================================================== */

#controls{
  position:fixed;

  z-index:950;

  left:15px;

  bottom:
    calc(
      18px +
      env(safe-area-inset-bottom)
    );

  width:175px;
  height:175px;

  pointer-events:none;
}

.control{
  position:absolute;

  width:56px;
  height:56px;

  border-radius:14px;

  border:2px solid #617895;

  background:#1d304d;

  color:white;

  font-size:24px;

  box-shadow:
    0 5px 10px
    rgba(0,0,0,.3);

  pointer-events:auto;

  touch-action:none;
}

.control:active{
  background:#3a587e;

  transform:scale(.93);
}

#up{
  left:59px;
  top:0;
}

#left{
  left:0;
  top:59px;
}

#right{
  right:0;
  top:59px;
}

#down{
  left:59px;
  bottom:0;
}


/* =====================================================
   WORLD BUTTON
===================================================== */

#worldButton{
  position:fixed;

  z-index:950;

  right:15px;

  bottom:
    calc(
      85px +
      env(safe-area-inset-bottom)
    );

  width:58px;
  height:58px;

  border-radius:50%;

  border:2px solid #647b9c;

  background:#1d304d;

  color:white;

  font-size:22px;

  touch-action:none;
}


/* =====================================================
   BATTLE
===================================================== */

/*
  ★戦闘画面

  width/heightを明示的に指定して、
  Safariで「右半分だけ表示される」問題を防ぐ。
*/

#battle{
  position:fixed !important;

  z-index:5000 !important;

  left:0 !important;
  top:0 !important;
  right:auto !important;
  bottom:auto !important;

  width:100vw !important;
  height:100dvh !important;

  min-width:100vw;
  min-height:100dvh;

  display:none;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  background:rgba(4,7,14,.0);

  opacity:0;

  transition:
    opacity .3s ease,
    background .3s ease;

  pointer-events:none;

  touch-action:none;
}

#battle.show{
  opacity:1;

  background:
    radial-gradient(
      circle at 70% 45%,
      rgba(164,86,38,.9),
      rgba(24,12,25,.97) 65%,
      rgba(5,7,14,1)
    );

  pointer-events:auto;
}


/* =====================================================
   BATTLE BACKGROUND
===================================================== */

.battleScene{
  position:absolute;

  inset:0;

  overflow:hidden;

  pointer-events:none;
}

.battleGlow{
  position:absolute;

  width:65vw;
  height:65vw;

  max-width:600px;
  max-height:600px;

  border-radius:50%;

  left:55%;
  top:40%;

  transform:
    translate(-50%,-50%);

  background:
    radial-gradient(
      circle,
      rgba(255,192,82,.55),
      rgba(255,120,40,.18) 40%,
      transparent 70%
    );

  filter:blur(10px);
}

.battleFloor{
  position:absolute;

  left:0;
  bottom:0;

  width:100%;
  height:42%;

  background:
    linear-gradient(
      165deg,
      rgba(82,53,39,.15),
      rgba(26,18,26,.85)
    );

  border-top:
    2px solid
    rgba(255,255,255,.08);

  transform:
    skewY(-5deg);

  transform-origin:left top;
}


/* =====================================================
   BATTLE BOX
===================================================== */

.battleBox{
  position:relative;

  z-index:10;

  width:min(94vw,720px);

  max-height:94dvh;

  padding:18px;

  border-radius:22px;

  background:
    linear-gradient(
      180deg,
      rgba(24,36,58,.96),
      rgba(14,22,37,.98)
    );

  border:2px solid #667b9c;

  color:white;

  text-align:center;

  box-shadow:
    0 15px 50px
    rgba(0,0,0,.6);

  overflow:hidden;
}


/* =====================================================
   BATTLE TOP
===================================================== */

.battleTop{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:12px;

  margin-bottom:8px;
}

.battleTitle{
  font-size:18px;

  font-weight:bold;
}

.battleTurn{
  padding:5px 9px;

  border-radius:9px;

  background:#273956;

  font-size:11px;
}


/* =====================================================
   ENEMY AREA
===================================================== */

.enemyArea{
  position:relative;

  min-height:190px;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;
}

.enemy{
  font-size:82px;

  line-height:1;

  margin:8px;

  filter:
    drop-shadow(
      0 8px 8px
      rgba(0,0,0,.45)
    );

  animation:
    enemyFloat
    2.2s
    ease-in-out
    infinite;
}

@keyframes enemyFloat{

  0%,
  100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-8px);
  }
}

.enemyName{
  font-size:18px;

  font-weight:bold;
}

.hp{
  width:min(90%,430px);

  height:18px;

  margin:10px auto 6px;

  border-radius:10px;

  overflow:hidden;

  background:#3a1919;

  border:1px solid #663333;
}

.hpBar{
  width:100%;

  height:100%;

  background:
    linear-gradient(
      90deg,
      #ef4949,
      #ff7676
    );

  transition:
    width .25s ease;
}

.enemyHPText{
  font-size:12px;

  opacity:.85;
}


/* =====================================================
   PARTY
===================================================== */

.party{
  display:flex;

  justify-content:center;

  gap:20px;

  margin:8px 0 15px;
}

.partyMember{
  min-width:110px;

  padding:8px;

  border-radius:12px;

  background:#101b2d;

  border:1px solid #425674;
}

.partyIcon{
  font-size:43px;

  line-height:45px;
}

.partyName{
  font-size:12px;

  font-weight:bold;
}

.partyHP{
  height:7px;

  margin-top:5px;

  border-radius:5px;

  background:#202c23;

  overflow:hidden;
}

.partyHPBar{
  width:100%;

  height:100%;

  background:#4fc76a;
}


/* =====================================================
   BATTLE COMMANDS
===================================================== */

.commands{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;
}

.command{
  min-height:58px;

  border:0;

  border-radius:13px;

  color:white;

  font-weight:bold;

  font-size:14px;

  border:1px solid
    rgba(255,255,255,.12);

  box-shadow:
    0 4px 8px
    rgba(0,0,0,.25);

  touch-action:none;
}

.command:active{
  transform:scale(.97);
}

.command.attack{
  background:#a94f39;
}

.command.skill{
  background:#55458f;
}

.command.guard{
  background:#304967;
}

.command.run{
  background:#304967;
}


/* =====================================================
   BATTLE LOG
===================================================== */

#battleLog{
  min-height:24px;

  margin-top:10px;

  padding:6px 8px;

  border-radius:9px;

  background:#0d1625;

  color:#d7e6ff;

  font-size:11px;
}


/* =====================================================
   WORLD PANEL
===================================================== */

#worldPanel{
  position:fixed;

  z-index:4000;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  width:100vw;
  height:100dvh;

  background:rgba(0,0,0,.7);

  touch-action:none;
}

.panel{
  width:85%;
  max-width:350px;

  padding:22px;

  border-radius:18px;

  background:#17243a;

  border:2px solid #657b9c;

  color:white;

  text-align:center;
}

.panel button{
  width:100%;

  margin-top:10px;

  padding:12px;

  border:0;

  border-radius:10px;

  background:#304967;

  color:white;

  font-weight:bold;
}

.close{
  background:#663b3b !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px){

  .battleBox{
    width:94vw;

    padding:14px;
  }

  .enemyArea{
    min-height:160px;
  }

  .enemy{
    font-size:68px;
  }

  .party{
    gap:8px;
  }

  .partyMember{
    min-width:100px;
  }

  .command{
    min-height:54px;
    font-size:13px;
  }

}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:700px){

  #viewport{
    width:700px;

    left:50%;

    transform:
      translateX(-50%);
  }

  #hud{
    width:700px;

    left:50%;

    transform:
      translateX(-50%);
  }

}


/* =====================================================
   SAFARI
===================================================== */

html,
body,
#viewport,
#world,
button{
  -webkit-touch-callout:none;
}

body{
  -webkit-text-size-adjust:none;
}

</style>
</head>


<body>


<!-- =====================================================
     HUD
===================================================== -->

<header id="hud">

  <div id="title">
    🌱 勇者そらまめ
  </div>

  <div class="stats">

    <div class="stat">
      Lv.<span id="level">1</span>
    </div>

    <div class="stat">
      💰 <span id="gold">0</span>
    </div>

  </div>

</header>


<!-- =====================================================
     VIEWPORT
===================================================== -->

<div id="viewport">

  <div id="world">


    <!-- 地形 -->

    <div class="road horizontal"></div>

    <div class="road vertical"></div>

    <div class="water"></div>

    <div class="village"></div>


    <!-- 木 -->

    <div class="tree t1"></div>
    <div class="tree t2"></div>
    <div class="tree t3"></div>
    <div class="tree t4"></div>
    <div class="tree t5"></div>
    <div class="tree t6"></div>


    <!-- 岩 -->

    <div class="rock r1"></div>
    <div class="rock r2"></div>
    <div class="rock r3"></div>


    <!-- ステージ -->

    <button
      class="stage"
      id="stage1">

      🚪 ステージ1

      <small>
        山道
      </small>

    </button>


    <!-- プレイヤー -->

    <div id="player">

      <div id="hero">
        🧑‍🌾
      </div>

      <div id="playerName">
        そらまめ
      </div>

      <div id="marker">
        🌱
      </div>

    </div>


  </div>

</div>


<!-- =====================================================
     MESSAGE
===================================================== -->

<div id="message">
  👣 フィールドを探索しよう！
</div>


<!-- =====================================================
     CONTROLS
===================================================== -->

<div id="controls">

  <button
    class="control"
    id="up">
    ▲
  </button>

  <button
    class="control"
    id="left">
    ◀
  </button>

  <button
    class="control"
    id="right">
    ▶
  </button>

  <button
    class="control"
    id="down">
    ▼
  </button>

</div>


<!-- =====================================================
     WORLD BUTTON
===================================================== -->

<button id="worldButton">
  🌎
</button>


<!-- =====================================================
     BATTLE
===================================================== -->

<div id="battle">

  <div class="battleScene">

    <div class="battleGlow"></div>

    <div class="battleFloor"></div>

  </div>


  <div class="battleBox">


    <div class="battleTop">

      <div class="battleTitle">
        ⚔️ バトル
      </div>

      <div
        class="battleTurn"
        id="battleTurn">

        PLAYER TURN

      </div>

    </div>


    <!-- 敵 -->

    <div class="enemyArea">

      <div
        class="enemy"
        id="enemyIcon">

        👾

      </div>

      <div
        class="enemyName"
        id="enemyName">

        グリーンスライム

      </div>

      <div class="hp">

        <div
          class="hpBar"
          id="enemyHPBar">
        </div>

      </div>

      <div class="enemyHPText">

        HP:
        <span id="enemyHPText">
          30 / 30
        </span>

      </div>

    </div>


    <!-- パーティー -->

    <div class="party">


      <div class="partyMember">

        <div class="partyIcon">
          🧑‍🌾
        </div>

        <div class="partyName">
          そらまめ
        </div>

        <div class="partyHP">

          <div
            class="partyHPBar"
            id="soramameHP">
          </div>

        </div>

      </div>


      <div class="partyMember">

        <div class="partyIcon">
          🛡️
        </div>

        <div class="partyName">
          えんどう
        </div>

        <div class="partyHP">

          <div
            class="partyHPBar"
            id="endouHP">
          </div>

        </div>

      </div>


    </div>


    <!-- コマンド -->

    <div class="commands">

      <button
        class="command attack"
        id="attackButton">

        ⚔️ こうげき

      </button>

      <button
        class="command skill"
        id="skillButton">

        ✨ スキル

      </button>

      <button
        class="command guard"
        id="guardButton">

        🛡️ ぼうぎょ

      </button>

      <button
        class="command run"
        id="runButton">

        🏃 にげる

      </button>

    </div>


    <div id="battleLog">
      敵の様子をうかがっている……
    </div>


  </div>

</div>


<!-- =====================================================
     WORLD PANEL
===================================================== -->

<div id="worldPanel">

  <div class="panel">

    <h2>
      🌎 世界移動
    </h2>

    <p>
      行き先を選択
    </p>

    <button id="surfaceSave">
      🌱 表世界・セーブポイント
    </button>

    <button id="underSave">
      🌑 裏世界・セーブポイント
    </button>

    <button
      class="close"
      id="closeWorld">

      閉じる

    </button>

  </div>

</div>


<script>

/* =====================================================
   GAME STATE
===================================================== */

const game = {

  level:1,

  gold:0,

  battle:false,

  steps:0,

  player:{

    /*
      ★ワールド座標

      プレイヤー自身は
      worldの中に固定。

      カメラだけがworldを動かす。
    */

    x:1200,

    y:900

  },

  camera:{

    x:0,

    y:0

  },

  enemy:{

    hp:30,

    maxHp:30,

    name:"",

    icon:"👾"

  },

  party:{

    soramameHP:100,

    soramameMaxHP:100,

    endouHP:100,

    endouMaxHP:100

  },

  guard:false

};


/* =====================================================
   CONSTANTS
===================================================== */

const WORLD_WIDTH = 2400;

const WORLD_HEIGHT = 1800;

const MOVE_SPEED = 12;


/* =====================================================
   ELEMENTS
===================================================== */

const viewport =
  document.getElementById(
    "viewport"
  );

const world =
  document.getElementById(
    "world"
  );

const player =
  document.getElementById(
    "player"
  );

const battle =
  document.getElementById(
    "battle"
  );


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

  document.getElementById(
    "level"
  ).textContent =
    game.level;

  document.getElementById(
    "gold"
  ).textContent =
    game.gold;

}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

  const width =
    viewport.clientWidth;

  const height =
    viewport.clientHeight;


  /*
    プレイヤーを画面中央付近へ。

    ただしマップ端では
    カメラを止める。
  */

  let cameraX =
    game.player.x -
    width / 2;

  let cameraY =
    game.player.y -
    height / 2;


  cameraX =
    Math.max(
      0,
      Math.min(
        cameraX,
        WORLD_WIDTH - width
      )
    );


  cameraY =
    Math.max(
      0,
      Math.min(
        cameraY,
        WORLD_HEIGHT - height
      )
    );


  game.camera.x =
    cameraX;

  game.camera.y =
    cameraY;


  /*
    ★重要

    worldだけを動かす。

    player.style.left/topを
    画面座標に書き換えない。

    これが以前の
    「そらまめが消える」
    「ステージと動きがおかしい」
    原因だった。
  */

  world.style.transform =
    `translate3d(${-cameraX}px,${-cameraY}px,0)`;

}


/* =====================================================
   PLAYER POSITION
===================================================== */

function updatePlayer(){

  /*
    プレイヤーはワールド座標そのもの。

    worldがカメラによって移動するので、
    playerも自動的に正しい場所へ表示される。
  */

  player.style.left =
    game.player.x + "px";

  player.style.top =
    game.player.y + "px";

}


/* =====================================================
   FULL UPDATE
===================================================== */

function updateWorld(){

  updatePlayer();

  updateCamera();

}


/* =====================================================
   MOVE
===================================================== */

function move(direction){

  if(game.battle)
    return;


  let oldX =
    game.player.x;

  let oldY =
    game.player.y;


  if(direction === "up")
    game.player.y -= MOVE_SPEED;

  if(direction === "down")
    game.player.y += MOVE_SPEED;

  if(direction === "left")
    game.player.x -= MOVE_SPEED;

  if(direction === "right")
    game.player.x += MOVE_SPEED;


  /*
    マップ外へ出ない
  */

  game.player.x =
    Math.max(
      40,
      Math.min(
        WORLD_WIDTH - 40,
        game.player.x
      )
    );


  game.player.y =
    Math.max(
      40,
      Math.min(
        WORLD_HEIGHT - 40,
        game.player.y
      )
    );


  /*
    実際に動いたか確認
  */

  if(
    oldX === game.player.x &&
    oldY === game.player.y
  ){
    return;
  }


  updateWorld();


  /*
    歩行アニメーション

    ★位置を変更するアニメーションではなく
    見た目だけ上下させる。
  */

  player.animate(

    [

      {
        transform:
          "translate(-50%,-50%) translateY(0)"
      },

      {
        transform:
          "translate(-50%,-50%) translateY(-7px)"
      },

      {
        transform:
          "translate(-50%,-50%) translateY(0)"
      }

    ],

    {

      duration:150,

      easing:"ease-out"

    }

  );


  game.steps++;


  /*
    エンカウント

    最初の15歩は安全。

    その後6%。
  */

  if(
    game.steps >= 15 &&
    Math.random() < 0.06
  ){

    game.steps = 0;

    encounter();

  }

}


/* =====================================================
   TOUCH CONTROLS
===================================================== */

function bindControl(
  id,
  direction
){

  const button =
    document.getElementById(id);


  button.addEventListener(

    "pointerdown",

    event => {

      event.preventDefault();

      event.stopPropagation();

      move(direction);

    },

    {
      passive:false
    }

  );

}


bindControl(
  "up",
  "up"
);

bindControl(
  "down",
  "down"
);

bindControl(
  "left",
  "left"
);

bindControl(
  "right",
  "right"
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(

  "keydown",

  event => {

    const keys = {

      ArrowUp:"up",

      ArrowDown:"down",

      ArrowLeft:"left",

      ArrowRight:"right",

      w:"up",

      s:"down",

      a:"left",

      d:"right"

    };


    const direction =
      keys[event.key];


    if(direction){

      event.preventDefault();

      move(direction);

    }

  }

);


/* =====================================================
   ENCOUNTER
===================================================== */

function encounter(){

  if(game.battle)
    return;


  const enemies = [

    {
      icon:"👾",
      name:"グリーンスライム",
      hp:30
    },

    {
      icon:"🐺",
      name:"ワイルドウルフ",
      hp:40
    },

    {
      icon:"🦇",
      name:"ダークバット",
      hp:35
    },

    {
      icon:"🌵",
      name:"サンドプラント",
      hp:45
    }

  ];


  const enemy =
    enemies[
      Math.floor(
        Math.random() *
        enemies.length
      )
    ];


  game.enemy.icon =
    enemy.icon;

  game.enemy.name =
    enemy.name;

  game.enemy.maxHp =
    enemy.hp;

  game.enemy.hp =
    enemy.hp;


  game.party.soramameHP =
    game.party.soramameMaxHP;

  game.party.endouHP =
    game.party.endouMaxHP;


  document.getElementById(
    "enemyIcon"
  ).textContent =
    enemy.icon;


  document.getElementById(
    "enemyName"
  ).textContent =
    enemy.name;


  document.getElementById(
    "battleLog"
  ).textContent =
    "敵がこちらを見ている……";


  updateEnemy();

  updateParty();


  openBattle();

}


/* =====================================================
   OPEN BATTLE
===================================================== */

function openBattle(){

  game.battle = true;

  game.guard = false;


  /*
    display:flexを先に指定。

    そのあとshowを付ける。
  */

  battle.style.display =
    "flex";


  battle.classList.remove(
    "show"
  );


  requestAnimationFrame(() => {

    requestAnimationFrame(() => {

      battle.classList.add(
        "show"
      );

    });

  });

}


/* =====================================================
   CLOSE BATTLE
===================================================== */

function closeBattle(){

  battle.classList.remove(
    "show"
  );


  setTimeout(() => {

    battle.style.display =
      "none";

    game.battle = false;

    game.guard = false;

  },320);

}


/* =====================================================
   ENEMY HP
===================================================== */

function updateEnemy(){

  const percent =
    Math.max(
      0,
      Math.min(
        100,
        game.enemy.hp /
        game.enemy.maxHp *
        100
      )
    );


  document.getElementById(
    "enemyHPBar"
  ).style.width =
    percent + "%";


  document.getElementById(
    "enemyHPText"
  ).textContent =

    game.enemy.hp +
    " / " +
    game.enemy.maxHp;

}


/* =====================================================
   PARTY HP
===================================================== */

function updateParty(){

  const soramame =
    game.party.soramameHP /
    game.party.soramameMaxHP *
    100;

  const endou =
    game.party.endouHP /
    game.party.endouMaxHP *
    100;


  document.getElementById(
    "soramameHP"
  ).style.width =
    Math.max(
      0,
      soramame
    ) + "%";


  document.getElementById(
    "endouHP"
  ).style.width =
    Math.max(
      0,
      endou
    ) + "%";

}


/* =====================================================
   BATTLE LOG
===================================================== */

function battleLog(text){

  document.getElementById(
    "battleLog"
  ).textContent =
    text;

}


/* =====================================================
   ATTACK
===================================================== */

document.getElementById(
  "attackButton"
)
.addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();

    event.stopPropagation();


    if(!game.battle)
      return;


    const damage =
      8 +
      Math.floor(
        Math.random() * 9
      );


    game.enemy.hp -=
      damage;


    if(game.enemy.hp < 0)
      game.enemy.hp = 0;


    updateEnemy();


    battleLog(
      `そらまめのこうげき！ ${damage}ダメージ！`
    );


    if(game.enemy.hp <= 0){

      victory();

      return;

    }


    enemyTurn();

  },

  {
    passive:false
  }

);


/* =====================================================
   SKILL
===================================================== */

document.getElementById(
  "skillButton"
)
.addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();

    event.stopPropagation();


    if(!game.battle)
      return;


    const damage =
      15 +
      Math.floor(
        Math.random() * 11
      );


    game.enemy.hp -=
      damage;


    if(game.enemy.hp < 0)
      game.enemy.hp = 0;


    updateEnemy();


    battleLog(
      `✨ そらまめのスキル！ ${damage}ダメージ！`
    );


    if(game.enemy.hp <= 0){

      victory();

      return;

    }


    enemyTurn();

  },

  {
    passive:false
  }

);


/* =====================================================
   GUARD
===================================================== */

document.getElementById(
  "guardButton"
)
.addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();

    event.stopPropagation();


    if(!game.battle)
      return;


    game.guard = true;


    battleLog(
      "🛡️ そらまめは身を守っている！"
    );


    enemyTurn();

  },

  {
    passive:false
  }

);


/* =====================================================
   RUN
===================================================== */

document.getElementById(
  "runButton"
)
.addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();

    event.stopPropagation();


    if(!game.battle)
      return;


    /*
      70%で逃走成功
    */

    if(Math.random() < .7){

      battleLog(
        "🏃 うまく逃げ切った！"
      );


      setTimeout(() => {

        closeBattle();

      },500);


    }else{

      battleLog(
        "❌ 逃げられなかった！"
      );


      enemyTurn();

    }

  },

  {
    passive:false
  }

);


/* =====================================================
   ENEMY TURN
===================================================== */

function enemyTurn(){

  if(!game.battle)
    return;


  document.getElementById(
    "battleTurn"
  ).textContent =
    "ENEMY TURN";


  setTimeout(() => {

    if(!game.battle)
      return;


    let damage =
      5 +
      Math.floor(
        Math.random() * 6
      );


    if(game.guard){

      damage =
        Math.floor(
          damage / 2
        );

      game.guard = false;

    }


    game.party.soramameHP -=
      damage;


    if(
      game.party.soramameHP < 0
    ){

      game.party.soramameHP =
        0;

    }


    updateParty();


    battleLog(
      `${game.enemy.name}のこうげき！ ${damage}ダメージ！`
    );


    if(
      game.party.soramameHP <= 0
    ){

      defeat();

      return;

    }


    document.getElementById(
      "battleTurn"
    ).textContent =
      "PLAYER TURN";

  },650);

}


/* =====================================================
   VICTORY
===================================================== */

function victory(){

  battleLog(
    "🎉 敵を倒した！"
  );


  game.gold += 30;

  game.level +=
    Math.random() < .25
      ? 1
      : 0;


  updateHUD();


  setTimeout(() => {

    closeBattle();

    showMessage(
      "✨ 戦闘に勝利した！ +30G"
    );

  },900);

}


/* =====================================================
   DEFEAT
===================================================== */

function defeat(){

  battleLog(
    "💀 そらまめは倒れてしまった……"
  );


  setTimeout(() => {

    closeBattle();


    game.player.x =
      1200;

    game.player.y =
      900;

    updateWorld();


    showMessage(
      "🌱 セーブポイントへ戻った！"
    );

  },1000);

}

/* =====================================================
   MESSAGE
===================================================== */

let messageTimer = null;


function showMessage(text){

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  clearTimeout(
    messageTimer
  );


  messageTimer =
    setTimeout(() => {

      message.textContent =
        "👣 フィールドを探索しよう！";

    },1800);

}


/* =====================================================
   SAFARI ZOOM PREVENTION
===================================================== */

let lastTouchTime = 0;


document.addEventListener(

  "touchend",

  event => {

    const now =
      Date.now();


    if(
      now - lastTouchTime <
      350
    ){

      event.preventDefault();

    }


    lastTouchTime =
      now;

  },

  {
    passive:false
  }

);


/* =====================================================
   PINCH ZOOM
===================================================== */

document.addEventListener(

  "touchmove",

  event => {

    if(
      event.touches &&
      event.touches.length > 1
    ){

      event.preventDefault();

    }

  },

  {
    passive:false
  }

);


/* =====================================================
   SAFARI GESTURES
===================================================== */

[
  "gesturestart",
  "gesturechange",
  "gestureend"
].forEach(

  type => {

    document.addEventListener(

      type,

      event => {

        event.preventDefault();

      },

      {
        passive:false
      }

    );

  }

);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(

  "resize",

  () => {

    updateWorld();

  }

);


/* =====================================================
   ORIENTATION CHANGE
===================================================== */

window.addEventListener(

  "orientationchange",

  () => {

    setTimeout(
      updateWorld,
      100
    );

  }

);


/* =====================================================
   START
===================================================== */

updateHUD();

updatePlayer();

updateCamera();

</script>
