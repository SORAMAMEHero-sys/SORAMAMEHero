<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>勇者そらまめ - フィールド試作3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#102039;color:#fff}
button{font:inherit;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;outline:none;-webkit-appearance:none;appearance:none}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:#47753b}
#hud{position:absolute;z-index:20;top:0;left:0;right:0;height:58px;background:#101b2c;border-bottom:2px solid #41526e;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-weight:800}
.title{font-size:15px}.stats{display:flex;gap:7px}.badge{padding:7px 10px;border-radius:12px;background:#263650;border:1px solid #617392;font-size:13px}
#notice{position:absolute;z-index:21;top:63px;left:8px;right:8px;text-align:center;background:rgba(10,39,17,.82);border-radius:12px;padding:7px;font-size:11px;color:#d9f4dc}
#world{position:absolute;touch-action:none;overscroll-behavior:none;inset:58px 0 0;overflow:hidden;background:
radial-gradient(circle at 52% 45%,rgba(116,204,93,.75),transparent 30%),
linear-gradient(155deg,#376b35 0 58%,#80643e 58% 77%,#2f6b7f 77%);}
#mapLayer{position:absolute;inset:-35%;width:170%;height:170%;will-change:transform;pointer-events:none;}
#path{position:absolute;left:-10%;top:52%;width:120%;height:25%;background:#8d7048;border-top:5px solid #725a3a;border-bottom:5px solid #725a3a;border-radius:20px;transform:rotate(1deg)}
.water{position:absolute;right:-10%;bottom:-4%;width:58%;height:24%;background:#21637b;border-top:5px solid #17485b}
.grass{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:25px 25px;opacity:.55}
#player{position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.player-body{font-size:48px;filter:drop-shadow(0 3px 2px #17351a)}
#playerName{margin-top:-3px;background:#142b18;padding:3px 9px;border-radius:10px;font-size:12px;font-weight:900}
#playerMarker{position:absolute;z-index:7;left:50%;top:calc(50% + 37px);transform:translateX(-50%);font-size:23px;filter:drop-shadow(0 2px 2px #17351a)}
.node{position:absolute;pointer-events:none;z-index:5;padding:9px 13px;border-radius:14px;background:#16261a;color:#fff;border:2px solid #4d7654;font-weight:900;box-shadow:0 4px 8px #18351a66}
.stage{right:10%;top:58%;background:#3d241b;border-color:#a76d45}
.mountain{left:45%;top:45%;font-size:14px}
#worldBtn{position:absolute;z-index:30;right:9px;top:54px;border:0;border-radius:13px;background:#d79b1e;color:white;padding:11px 14px;font-weight:900;box-shadow:0 3px 0 #8b5e0c}
#dpad{position:absolute;touch-action:none;user-select:none;-webkit-user-select:none;z-index:30;left:10px;bottom:22px;width:158px;height:150px}
.pad{position:absolute;width:55px;height:55px;border-radius:13px;border:2px solid #7184a5;background:#233652;color:#fff;box-shadow:0 4px 0 #142239;font-size:25px;font-weight:900}
.pad:active{transform:translateY(3px);box-shadow:0 1px 0 #142239}
.up{left:52px;top:0}.left{left:0;top:52px}.right{right:0;top:52px}.down{left:52px;bottom:0}
#menu{position:absolute;z-index:30;right:10px;bottom:25px;width:58px;height:58px;border-radius:50%;border:2px solid #8799b7;background:#263752;color:#fff;font-size:24px}
#fade{position:absolute;z-index:100;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s ease}
#encounter{position:absolute;z-index:110;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.78);opacity:0;pointer-events:none}
.enc-card{transform:scale(.82);text-align:center;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.enc-flash{font-size:58px}.enc-title{font-size:27px;font-weight:1000;letter-spacing:3px}.enc-sub{margin-top:8px;color:#ddd}
.show{opacity:1!important}.show .enc-card{transform:scale(1)}
#battle{position:absolute;z-index:120;inset:0;display:none;background:linear-gradient(#101a2c,#17233a);padding:70px 18px 20px}
.enemy{font-size:74px;text-align:center;margin:60px 0 20px}.battleTitle{text-align:center;font-size:22px;font-weight:1000}
.battleBox{position:absolute;left:18px;right:18px;bottom:25px;background:#0c1422;border:2px solid #4d607d;border-radius:18px;padding:15px}
.battleBox button{padding:12px 20px;margin:4px;border:0;border-radius:12px;background:#395274;color:#fff;font-weight:900}
</style>
</head>
<body>
<div id="game">
  <div id="hud"><div class="title">🌱 勇者そらまめ</div><div class="stats"><div class="badge">Lv.3</div><div class="badge">💰 375</div></div></div>
  <div id="notice">👣 歩いていると敵が突然あらわれる！　敵はフィールドには表示されません</div>
  <div id="world"><div id="mapLayer">
    <div class="grass"></div><div id="path"></div><div class="water"></div>
    <div class="node mountain">⛰️ 山道</div>
    <div class="node stage">🚪 ステージ1</div>
    <button id="worldBtn">🌎 世界移動</button>
    </div><div id="player"><div class="player-body">🧑‍🌾</div><div id="playerName">そらまめ</div></div>
    <div id="playerMarker">🌱</div>
  </div>
  <div id="dpad">
    <button class="pad up" data-dir="up">▲</button><button class="pad left" data-dir="left">◀</button>
    <button class="pad right" data-dir="right">▶</button><button class="pad down" data-dir="down">▼</button>
  </div>
  <button id="menu">☰</button>
  <div id="fade"></div>
  <div id="encounter"><div class="enc-card"><div class="enc-flash">⚡👾⚡</div><div class="enc-title">てきが あらわれた！</div><div class="enc-sub">戦闘準備中……</div></div></div>
  <div id="battle">
    <div class="battleTitle">⚔️ バトル</div><div class="enemy">👾</div>
    <div class="battleBox"><b>そらまめ Lv.3</b><br><br>
      <button onclick="attack()">こうげき</button><button onclick="endBattle()">にげる</button>
    </div>
  </div>
</div>
<script>
let x=0,y=0,moving=false,steps=0,inBattle=false;
const world=document.getElementById('world');
function move(dir){
  if(inBattle)return;
  const dx={left:-1,right:1,up:0,down:0}[dir];
  const dy={left:0,right:0,up:-1,down:1}[dir];
  x+=dx;y+=dy;steps++;
  // そらまめは画面中央に固定。地形・ステージだけがカメラに合わせて動く。
  document.getElementById('mapLayer').style.transform =
    `translate(${-x*34}px,${-y*34}px)`;
  if(steps>=4 && Math.random()<0.23){steps=0;encounter();}
}
document.querySelectorAll('.pad').forEach(b=>{
  b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(e.pointerType==='mouse'&&e.button!==0)return;move(b.dataset.dir)});
  b.addEventListener('dblclick',e=>e.preventDefault());
});
function encounter(){
  if(inBattle)return;
  inBattle=true;
  const enc=document.getElementById('encounter'),fade=document.getElementById('fade');
  enc.classList.add('show');
  setTimeout(()=>fade.classList.add('show'),260);
  setTimeout(()=>{
    enc.classList.remove('show');fade.classList.remove('show');
    document.getElementById('battle').style.display='block';
  },1050);
}
function attack(){
  document.querySelector('.enemy').textContent='💥';
  setTimeout(()=>endBattle(),450);
}
function endBattle(){
  document.getElementById('battle').style.display='none';inBattle=false;
}
document.getElementById('worldBtn').onclick=()=>alert('表世界・裏世界のセーブポイントを選択できます！');
document.getElementById('menu').onclick=()=>alert('メニュー（試作）');
</script>
</body>
</html>
