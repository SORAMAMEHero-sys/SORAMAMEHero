<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no">

<title>勇者そらまめ - エリア1</title>

<style>

/* =========================================================
   BASE
========================================================= */

*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101827;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    sans-serif;
  touch-action:none;
}

button{
  font-family:inherit;
  cursor:pointer;
}


/* =========================================================
   HUD
========================================================= */

#hud{
  position:fixed;
  z-index:100;

  top:0;
  left:0;

  width:100%;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:8px 12px;

  color:white;

  background:#101827;

  border-bottom:2px solid #4d6380;
}

#title{
  font-size:15px;
  font-weight:bold;
}

.stats{
  display:flex;
  gap:7px;
}

.stat{
  padding:6px 9px;

  border-radius:10px;

  background:#202e46;

  border:1px solid #596d8d;

  font-size:13px;
  font-weight:bold;
}


/* =========================================================
   VIEWPORT
========================================================= */

#viewport{
  position:absolute;

  left:0;
  top:58px;

  width:100%;
  height:calc(100% - 58px);

  overflow:hidden;

  background:#376e37;
}


/* =========================================================
   WORLD
========================================================= */

#world{
  position:absolute;

  width:2400px;
  height:1800px;

  left:0;
  top:0;

  transform-origin:0 0;

  will-change:transform;

  background-color:#376e37;

  background-image:
    radial-gradient(
      rgba(255,255,255,.08)
      1px,
      transparent 1px
    );

  background-size:35px 35px;
}


/* =========================================================
   STAGE THEME
========================================================= */

#world.stageForest{
  background-color:#376e37;
}

#world.stageCave{
  background-color:#333846;

  background-image:
    radial-gradient(
      rgba(255,255,255,.05)
      1px,
      transparent 1px
    );
}

#world.stageSea{
  background-color:#276c7e;

  background-image:
    radial-gradient(
      rgba(255,255,255,.08)
      1px,
      transparent 1px
    );
}


/* =========================================================
   STAGE DECORATIONS
========================================================= */

.decor{
  position:absolute;
  pointer-events:none;
}

.forestDecor{
  width:85px;
  height:85px;

  border-radius:50%;

  background:#285f31;

  border:9px solid #194725;

  box-shadow:
    inset 0 0 0 6px #3f8141;
}

.caveDecor{
  width:75px;
  height:52px;

  border-radius:50%;

  background:#626873;

  border:5px solid #414650;
}

.seaDecor{
  width:90px;
  height:90px;

  border-radius:50%;

  background:#3b9bb0;

  border:5px solid #216579;
}


/* =========================================================
   STAGE SELECT AREA
========================================================= */

.stageSelectArea{
  position:absolute;

  z-index:8;

  left:180px;
  top:250px;

  width:600px;
  min-height:340px;

  padding:25px;

  border-radius:30px;

  background:
    linear-gradient(
      145deg,
      #365f38,
      #27492d
    );

  border:6px solid #203d25;

  box-shadow:
    0 12px 25px rgba(0,0,0,.3);
}

.stageSelectTitle{
  text-align:center;

  color:white;

  font-size:25px;

  font-weight:900;

  letter-spacing:3px;

  text-shadow:
    0 3px 4px rgba(0,0,0,.5);

  margin-bottom:20px;
}

.areaLabel{
  text-align:center;

  color:#ffd866;

  font-size:13px;

  font-weight:bold;

  margin-bottom:14px;
}

.stageCards{
  display:flex;

  gap:14px;

  justify-content:center;

  flex-wrap:wrap;
}

.stageCard{
  width:165px;
  min-height:115px;

  padding:14px;

  border-radius:17px;

  border:3px solid #aa694a;

  background:#43251c;

  color:white;

  font-weight:bold;

  box-shadow:
    0 7px 14px rgba(0,0,0,.35);

  transition:
    transform .1s,
    filter .1s;
}

.stageCard:active{
  transform:scale(.95);
  filter:brightness(1.2);
}

.stageCard.locked{
  background:#252a32;

  border-color:#555d68;

  opacity:.55;
}

.stageCardTitle{
  font-size:17px;
}

.stageCardSmall{
  display:block;

  margin-top:7px;

  font-size:11px;

  opacity:.75;
}

.stageCardClear{
  margin-top:8px;

  font-size:11px;

  color:#ffe66d;
}


/* =========================================================
   VILLAGE
========================================================= */

.village{
  position:absolute;

  left:220px;
  top:700px;

  width:300px;
  height:230px;

  background:#548d43;

  border:5px solid #3d6e34;

  border-radius:30px;
}


/* =========================================================
   ROAD
========================================================= */

.road{
  position:absolute;

  background:#927247;

  border:6px solid #765a37;

  border-radius:35px;
}

.road.horizontal{
  left:-100px;
  top:760px;

  width:2600px;
  height:190px;
}

.road.vertical{
  left:1120px;
  top:-100px;

  width:190px;
  height:2000px;
}


/* =========================================================
   WATER
========================================================= */

.water{
  position:absolute;

  left:1450px;
  top:170px;

  width:650px;
  height:390px;

  background:#286f88;

  border:7px solid #1d5367;

  border-radius:50px;
}


/* =========================================================
   GOAL
========================================================= */

#goal{
  position:absolute;

  z-index:25;

  left:1200px;
  top:120px;

  width:220px;
  height:180px;

  transform:
    translate(-50%,-50%);

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:flex-start;

  pointer-events:none;
}

.goalArrow{
  width:0;
  height:0;

  border-left:72px solid transparent;
  border-right:72px solid transparent;

  border-top:0;
  border-bottom:52px solid #777;

  filter:
    drop-shadow(
      0 4px 3px
      rgba(0,0,0,.35)
    );

  position:relative;
}

.goalArrow:after{
  content:"";

  position:absolute;

  left:-76px;
  top:-56px;

  width:152px;
  height:58px;

  clip-path:
    polygon(
      50% 0%,
      100% 100%,
      0% 100%
    );

  background:#555;

  z-index:-1;
}

.goalText{
  margin-top:10px;

  font-family:monospace;

  font-size:27px;

  font-weight:900;

  letter-spacing:8px;

  color:#777;

  text-shadow:
    0 3px 0 #333,
    0 5px 8px rgba(0,0,0,.5);
}

#goal.unlocked .goalArrow{
  border-bottom-color:#fff;
}

#goal.unlocked .goalText{
  color:#fff;
}

#goal.reached .goalArrow{
  animation:
    goalFlash .5s infinite alternate;
}

#goal.reached .goalText{
  animation:
    goalTextFlash .5s infinite alternate;
}

@keyframes goalFlash{

  from{
    filter:
      drop-shadow(
        0 4px 3px
        rgba(0,0,0,.35)
      );
  }

  to{
    filter:
      drop-shadow(
        0 0 15px
        rgba(255,255,255,.95)
      );
  }
}

@keyframes goalTextFlash{

  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.12);
  }
}


/* =========================================================
   KEY
========================================================= */

.key{
  position:absolute;

  z-index:30;

  width:55px;
  height:55px;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:35px;

  border-radius:50%;

  background:
    rgba(255,216,102,.15);

  border:3px solid rgba(255,216,102,.6);

  box-shadow:
    0 0 18px rgba(255,216,102,.25);

  animation:
    keyFloat 1s infinite alternate;
}

.key.collected{
  display:none;
}

@keyframes keyFloat{

  from{
    transform:translateY(0);
  }

  to{
    transform:translateY(-7px);
  }
}


/* =========================================================
   KEY COUNTER
========================================================= */

#keyCounter{
  position:fixed;

  z-index:95;

  left:50%;
  top:68px;

  transform:translateX(-50%);

  padding:7px 13px;

  border-radius:12px;

  background:rgba(15,24,39,.9);

  border:1px solid #7184a2;

  color:white;

  font-size:12px;

  font-weight:bold;

  pointer-events:none;
}


/* =========================================================
   STAGE INFO
========================================================= */

#stageInfo{
  position:fixed;

  z-index:95;

  left:50%;
  bottom:18px;

  transform:translateX(-50%);

  padding:7px 14px;

  border-radius:12px;

  background:rgba(15,24,39,.9);

  border:1px solid #7184a2;

  color:white;

  font-size:12px;

  font-weight:bold;

  pointer-events:none;
}


/* =========================================================
   PLAYER
========================================================= */

#player{
  position:absolute;

  z-index:50;

  width:80px;
  height:90px;

  pointer-events:none;

  transform:
    translate(-50%,-50%);
}

#hero{
  text-align:center;

  font-size:44px;

  line-height:50px;
}

#playerName{
  display:block;

  width:max-content;

  margin:auto;

  padding:3px 9px;

  border-radius:10px;

  background:#111;

  color:white;

  font-size:12px;

  font-weight:bold;
}

#marker{
  text-align:center;

  font-size:20px;
}


/* =========================================================
   MESSAGE
========================================================= */

#message{
  position:fixed;

  z-index:80;

  left:50%;
  top:105px;

  transform:
    translateX(-50%);

  width:max-content;

  max-width:90%;

  padding:7px 12px;

  border-radius:12px;

  background:rgba(15,40,20,.88);

  color:#d9ffd9;

  font-size:12px;

  pointer-events:none;
}


/* =========================================================
   FIELD CONTROLS
========================================================= */

#controls{
  position:fixed;

  z-index:90;

  left:15px;
  bottom:18px;

  width:175px;
  height:175px;
}

.control{
  position:absolute;

  width:56px;
  height:56px;

  border-radius:14px;

  border:2px solid #617895;

  background:#1d304d;

  color:white;

  font-size:24px;

  box-shadow:
    0 5px 10px rgba(0,0,0,.3);
}

.control:active{
  background:#3a587e;

  transform:scale(.93);
}

#up{
  left:59px;
  top:0;
}

#left{
  left:0;
  top:59px;
}

#right{
  right:0;
  top:59px;
}

#down{
  left:59px;
  bottom:0;
}


/* =========================================================
   WORLD BUTTON
========================================================= */

#worldButton{
  position:fixed;

  z-index:90;

  right:15px;
  bottom:85px;

  width:58px;
  height:58px;

  border-radius:50%;

  border:2px solid #647b9c;

  background:#1d304d;

  color:white;

  font-size:22px;
}


/* =========================================================
   BATTLE TRANSITION
========================================================= */

#battleTransition{
  position:fixed;

  z-index:1000;

  inset:0;

  pointer-events:none;

  background:#080b14;

  opacity:0;

  transition:
    opacity .25s ease;
}

#battleTransition.active{
  opacity:1;
}

#battleTransition.flash{
  animation:
    battleFlash .55s ease;
}

@keyframes battleFlash{

  0%{
    background:#ffffff;
    opacity:0;
  }

  15%{
    background:#ffffff;
    opacity:.95;
  }

  35%{
    background:#ffffff;
    opacity:.15;
  }

  55%{
    background:#080b14;
    opacity:1;
  }

  100%{
    background:#080b14;
    opacity:1;
  }
}

#viewport.battleShake{
  animation:
    battleShake .45s ease;
}

@keyframes battleShake{

  0%{
    transform:translate(0,0);
  }

  20%{
    transform:translate(-8px,4px);
  }

  40%{
    transform:translate(8px,-4px);
  }

  60%{
    transform:translate(-5px,2px);
  }

  80%{
    transform:translate(4px,-2px);
  }

  100%{
    transform:translate(0,0);
  }
}


/* =========================================================
   BATTLE SCREEN
========================================================= */

#battle{
  position:fixed;

  z-index:200;

  inset:0;

  display:none;

  opacity:0;

  background:
    radial-gradient(
      circle at 50% 42%,
      #c77b43 0%,
      #9b5138 30%,
      #432b36 72%,
      #141827 100%
    );

  transition:
    opacity .35s;
}

#battle.show{
  opacity:1;
}


/* =========================================================
   BATTLE HEADER
========================================================= */

.battleTop{
  position:absolute;

  top:12px;
  left:12px;
  right:12px;

  display:flex;

  justify-content:space-between;

  align-items:flex-start;

  pointer-events:none;
}

.enemyInfo{
  width:180px;

  padding:9px 12px;

  border-radius:13px;

  background:#111827;

  border:2px solid #7184a2;

  color:white;

  box-shadow:
    0 5px 15px rgba(0,0,0,.35);
}

.enemyTitle{
  font-size:14px;

  font-weight:bold;

  margin-bottom:6px;
}

.enemyHPOuter{
  width:100%;

  height:10px;

  overflow:hidden;

  border-radius:10px;

  background:#431c28;
}

.enemyHPInner{
  width:100%;

  height:100%;

  background:#e94b62;

  transition:
    width .3s;
}

.enemyHPText{
  margin-top:4px;

  font-size:11px;

  opacity:.9;
}

.turnInfo{
  min-width:130px;

  padding:9px 12px;

  border-radius:13px;

  background:#111827;

  border:2px solid #7184a2;

  color:white;

  text-align:center;

  font-size:12px;

  font-weight:bold;
}


/* =========================================================
   ENEMY CENTER
========================================================= */

.battleEnemy{
  position:absolute;

  left:50%;
  top:42%;

  transform:
    translate(-50%,-50%);

  text-align:center;

  color:white;
}

.enemyIcon{
  font-size:115px;

  line-height:1;

  filter:
    drop-shadow(
      0 15px 15px
      rgba(0,0,0,.45)
    );

  transition:
    transform .15s;
}

.enemyIcon.hit{
  animation:
    enemyHit .3s;
}

.enemyNameBig{
  margin-top:12px;

  font-size:18px;

  font-weight:bold;

  text-shadow:
    0 3px 5px rgba(0,0,0,.6);
}

@keyframes enemyHit{

  0%{
    transform:translateX(0);
  }

  25%{
    transform:translateX(-14px);
  }

  50%{
    transform:translateX(14px);
  }

  75%{
    transform:translateX(-8px);
  }

  100%{
    transform:translateX(0);
  }
}


/* =========================================================
   BATTLE LOG
========================================================= */

#battleLog{
  position:absolute;

  left:50%;

  bottom:300px;

  transform:
    translateX(-50%);

  width:min(90%,450px);

  padding:9px 14px;

  border-radius:11px;

  background:rgba(13,17,28,.88);

  border:1px solid #4f5d77;

  color:white;

  text-align:center;

  font-size:12px;

  min-height:36px;

  display:flex;

  align-items:center;

  justify-content:center;

  box-shadow:
    0 5px 15px rgba(0,0,0,.3);
}


/* =========================================================
   DAMAGE
========================================================= */

.damageNumber{
  position:absolute;

  z-index:500;

  pointer-events:none;

  font-size:30px;

  font-weight:900;

  color:#fff;

  text-shadow:
    0 3px 0 #7b1d1d,
    0 0 10px rgba(255,255,255,.6);

  animation:
    damageFloat .8s forwards;
}

@keyframes damageFloat{

  0%{
    opacity:0;
    transform:
      translate(-50%,0)
      scale(.5);
  }

  20%{
    opacity:1;
    transform:
      translate(-50%,-15px)
      scale(1.2);
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-75px)
      scale(1);
  }
}


/* =========================================================
   PARTY
========================================================= */

.partyArea{
  position:absolute;

  left:50%;

  bottom:112px;

  transform:
    translateX(-50%);

  width:min(96%,620px);

  display:flex;

  justify-content:center;

  align-items:flex-end;

  gap:12px;
}

.partyMember{
  position:relative;

  width:125px;

  min-width:0;

  padding:8px 7px 6px;

  border-radius:13px;

  background:
    linear-gradient(
      #243650,
      #142033
    );

  border:2px solid #617998;

  color:white;

  text-align:center;

  transition:
    transform .2s,
    border-color .2s,
    box-shadow .2s,
    opacity .2s;
}

.partyMember.active{
  transform:
    translateY(-12px);

  border-color:#ffd45c;

  box-shadow:
    0 0 0 2px rgba(255,212,92,.25),
    0 8px 20px rgba(0,0,0,.4);
}

.partyMember.dead{
  opacity:.4;
  filter:grayscale(1);
}

.partyCharacter{
  height:76px;

  display:flex;

  justify-content:center;

  align-items:center;

  font-size:62px;

  line-height:1;

  filter:
    drop-shadow(
      0 5px 5px rgba(0,0,0,.4)
    );
}

.partyName{
  font-size:12px;

  font-weight:bold;

  padding:3px;

  border-radius:7px;

  background:#101827;
}

.barLabel{
  display:flex;

  justify-content:space-between;

  margin-top:4px;

  font-size:9px;
}

.bar{
  width:100%;

  height:7px;

  overflow:hidden;

  border-radius:8px;

  margin-top:2px;

  background:#18202d;
}

.barHP{
  width:100%;

  height:100%;

  background:#45d477;

  transition:
    width .25s;
}

.barMP{
  width:100%;

  height:100%;

  background:#55a7ff;

  transition:
    width .25s;
}


/* =========================================================
   COMMAND
========================================================= */

.commandArea{
  position:absolute;

  left:50%;

  bottom:12px;

  transform:
    translateX(-50%);

  width:min(96%,620px);

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:7px;
}

.command{
  min-height:52px;

  border-radius:11px;

  border:2px solid rgba(255,255,255,.22);

  color:white;

  font-size:14px;

  font-weight:bold;

  box-shadow:
    0 4px 8px rgba(0,0,0,.3);

  transition:
    transform .1s,
    filter .1s;
}

.command:active{
  transform:
    scale(.97);

  filter:
    brightness(1.2);
}

.command.attack{
  background:#a9523d;
}

.command.skill{
  background:#55458e;
}

.command.defend{
  background:#304d6d;
}

.command.run{
  background:#30425a;
}


/* =========================================================
   SKILL WINDOW
========================================================= */

#skillWindow{
  position:absolute;

  z-index:600;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  width:min(88%,400px);

  padding:18px;

  border-radius:18px;

  background:#131d2f;

  border:2px solid #7083a2;

  color:white;

  box-shadow:
    0 15px 50px rgba(0,0,0,.55);

  display:none;
}

#skillWindow.show{
  display:block;
}

.skillTitle{
  margin:0 0 12px;

  text-align:center;
}

.skillButton{
  width:100%;

  padding:12px;

  margin-top:7px;

  border:0;

  border-radius:10px;

  background:#354c70;

  color:white;

  font-weight:bold;

  text-align:left;
}

.skillButton span{
  float:right;

  opacity:.7;
}

.skillClose{
  width:100%;

  padding:10px;

  margin-top:10px;

  border:0;

  border-radius:10px;

  background:#663d3d;

  color:white;
}


/* =========================================================
   RESULT
========================================================= */

#battleResult{
  position:absolute;

  z-index:700;

  inset:0;

  display:none;

  align-items:center;

  justify-content:center;

  background:rgba(5,8,15,.78);
}

.resultBox{
  width:min(85%,380px);

  padding:28px;

  border-radius:20px;

  background:#17243a;

  border:2px solid #7083a2;

  color:white;

  text-align:center;

  box-shadow:
    0 15px 50px rgba(0,0,0,.6);

  animation:
    resultAppear .3s;
}

@keyframes resultAppear{

  from{
    transform:scale(.8);
    opacity:0;
  }

  to{
    transform:scale(1);
    opacity:1;
  }
}

.resultIcon{
  font-size:65px;
}

.resultTitle{
  font-size:25px;

  font-weight:bold;

  margin:8px 0;
}

.resultText{
  opacity:.85;

  font-size:14px;
}

.resultButton{
  width:100%;

  margin-top:18px;

  padding:13px;

  border:0;

  border-radius:12px;

  background:#476c49;

  color:white;

  font-weight:bold;
}


/* =========================================================
   GOAL RESULT
========================================================= */

#goalResult{
  position:fixed;

  z-index:900;

  inset:0;

  display:none;

  align-items:center;

  justify-content:center;

  background:

<script>

/* =========================================================
   GAME DATA
========================================================= */

const game = {

  level:1,

  gold:0,

  battle:false,

  goalReached:false,

  stageMode:false,

  currentStage:0,

  currentTurn:0,

  steps:0,

  clearedStages:[],

  collectedKeys:[],

  player:{

    x:420,

    y:620

  },

  camera:{

    x:0,

    y:0

  },

  enemy:{

    name:"",

    icon:"👾",

    hp:50,

    maxHp:50,

    boss:false

  },

  party:[

    {
      name:"そらまめ",
      icon:"🧑‍🌾",
      hp:100,
      maxHp:100,
      mp:50,
      maxMp:50,
      defend:false
    },

    {
      name:"えんどう",
      icon:"🛡️",
      hp:90,
      maxHp:90,
      mp:40,
      maxMp:40,
      defend:false
    },

    {
      name:"えだまめ",
      icon:"🌿",
      hp:80,
      maxHp:80,
      mp:60,
      maxMp:60,
      defend:false
    }

  ]

};


/* =========================================================
   STAGE DATA
========================================================= */

const stages = {

  1:{
    name:"森",
    icon:"🌲",
    boss:{
      name:"カマセキャット",
      icon:"🐱",
      hp:90
    },
    keys:3,
    keyPositions:[
      [700,600],
      [900,950],
      [1050,500]
    ],
    bg:"stageForest"
  },

  2:{
    name:"洞窟",
    icon:"🪨",
    boss:{
      name:"ホドック",
      icon:"👹",
      hp:120
    },
    keys:4,
    keyPositions:[
      [650,450],
      [850,1050],
      [1050,650],
      [900,300]
    ],
    bg:"stageCave",
    soldier:{
      name:"ヌクレアイス",
      icon:"❄️",
      hp:100
    }
  },

  3:{
    name:"海",
    icon:"🌊",
    boss:{
      name:"シャラッシー",
      icon:"🦑",
      hp:150
    },
    keys:5,
    keyPositions:[
      [600,500],
      [800,900],
      [1050,450],
      [850,1150],
      [1050,800]
    ],
    bg:"stageSea",
    soldier:{
      name:"ヌクレアイス",
      icon:"❄️",
      hp:115
    }
  }

};


/* =========================================================
   SAVE / LOAD
========================================================= */

function saveGame(){

  localStorage.setItem(
    "soramame_area1_save",
    JSON.stringify({
      level:game.level,
      gold:game.gold,
      clearedStages:game.clearedStages
    })
  );

}


function loadGame(){

  try{

    const data =
      JSON.parse(
        localStorage.getItem(
          "soramame_area1_save"
        )
      );

    if(!data)
      return;

    game.level =
      data.level || 1;

    game.gold =
      data.gold || 0;

    game.clearedStages =
      Array.isArray(
        data.clearedStages
      )
        ? data.clearedStages
        : [];

  }catch(error){

    console.log(
      "セーブデータを読み込めませんでした。",
      error
    );

  }

}


/* =========================================================
   ELEMENTS
========================================================= */

const battleTransition =
  document.getElementById(
    "battleTransition"
  );

const viewport =
  document.getElementById(
    "viewport"
  );

const world =
  document.getElementById(
    "world"
  );

const player =
  document.getElementById(
    "player"
  );

const battle =
  document.getElementById(
    "battle"
  );

const battleLog =
  document.getElementById(
    "battleLog"
  );

const skillWindow =
  document.getElementById(
    "skillWindow"
  );

const battleResult =
  document.getElementById(
    "battleResult"
  );

const goal =
  document.getElementById(
    "goal"
  );

const goalResult =
  document.getElementById(
    "goalResult"
  );

const keyCounter =
  document.getElementById(
    "keyCounter"
  );

const stageInfo =
  document.getElementById(
    "stageInfo"
  );

const stageSelectArea =
  document.getElementById(
    "stageSelectArea"
  );


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  document.getElementById(
    "level"
  ).textContent =
    game.level;

  document.getElementById(
    "gold"
  ).textContent =
    game.gold;

}


/* =========================================================
   STAGE SELECT
========================================================= */

function updateStageSelect(){

  for(let i = 1; i <= 3; i++){

    const button =
      document.getElementById(
        "stageSelect" + i
      );

    const text =
      document.getElementById(
        "stage" + i + "Clear"
      );


    const unlocked =
      i === 1 ||
      game.clearedStages.includes(
        i - 1
      );

    const cleared =
      game.clearedStages.includes(i);


    button.classList.toggle(
      "locked",
      !unlocked
    );


    if(cleared){

      text.textContent =
        "✓ CLEAR済み";

    }else if(unlocked){

      text.textContent =
        "プレイ可能";

    }else{

      text.textContent =
        "🔒 未解放";

    }

  }

}


/* =========================================================
   CLEAR KEYS
========================================================= */

function clearKeys(){

  document
    .querySelectorAll(
      ".key"
    )
    .forEach(
      key =>
        key.remove()
    );

}


/* =========================================================
   CREATE STAGE KEYS
========================================================= */

function createStageKeys(){

  clearKeys();

  game.collectedKeys = [];

  const stage =
    stages[
      game.currentStage
    ];

  if(!stage)
    return;


  stage.keyPositions.forEach(
    (position,index) => {

      const key =
        document.createElement(
          "div"
        );

      key.className =
        "key";

      key.dataset.key =
        index;

      key.style.left =
        position[0] + "px";

      key.style.top =
        position[1] + "px";

      key.textContent =
        "🔑";

      world.appendChild(
        key
      );

    }
  );


  updateKeyCounter();

}


/* =========================================================
   KEY COUNTER
========================================================= */

function updateKeyCounter(){

  const stage =
    stages[
      game.currentStage
    ];


  if(!game.stageMode || !stage){

    keyCounter.textContent =
      "🔑 ステージ選択中";

    return;

  }


  keyCounter.textContent =

    "🔑 鍵 " +
    game.collectedKeys.length +
    " / " +
    stage.keys;


  if(
    game.collectedKeys.length >=
    stage.keys
  ){

    keyCounter.textContent =
      "🔓 🔑 鍵をすべて集めた！";

  }

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

  const width =
    viewport.clientWidth;

  const height =
    viewport.clientHeight;


  game.camera.x =
    game.player.x -
    width / 2;

  game.camera.y =
    game.player.y -
    height / 2;


  game.camera.x =
    Math.max(
      0,
      Math.min(
        game.camera.x,
        2400 - width
      )
    );


  game.camera.y =
    Math.max(
      0,
      Math.min(
        game.camera.y,
        1800 - height
      )
    );


  world.style.transform =
    `translate(
      ${-game.camera.x}px,
      ${-game.camera.y}px
    )`;


  player.style.left =
    game.player.x + "px";

  player.style.top =
    game.player.y + "px";

}


/* =========================================================
   DISTANCE
========================================================= */

function distanceBetween(
  x1,
  y1,
  x2,
  y2
){

  const dx =
    x1 - x2;

  const dy =
    y1 - y2;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


/* =========================================================
   COLLECT KEYS
========================================================= */

function checkKeys(){

  if(!game.stageMode)
    return;


  document
    .querySelectorAll(
      ".key:not(.collected)"
    )
    .forEach(
      key => {

        const x =
          parseFloat(
            key.style.left
          ) + 27;

        const y =
          parseFloat(
            key.style.top
          ) + 27;


        if(
          distanceBetween(
            game.player.x,
            game.player.y,
            x,
            y
          ) <= 65
        ){

          const id =
            Number(
              key.dataset.key
            );


          if(
            game.collectedKeys.includes(
              id
            )
          ){

            return;

          }


          game.collectedKeys.push(
            id
          );


          key.classList.add(
            "collected"
          );


          updateKeyCounter();


          const stage =
            stages[
              game.currentStage
            ];


          showMessage(
            "🔑 鍵を手に入れた！ " +
            game.collectedKeys.length +
            "/" +
            stage.keys
          );


          if(
            game.collectedKeys.length >=
            stage.keys
          ){

            unlockGoal();

          }

        }

      }
    );

}


/* =========================================================
   GOAL
========================================================= */

function unlockGoal(){

  goal.classList.add(
    "unlocked"
  );


  showMessage(
    "🔓 鍵が全部そろった！ GOALへ向かおう！"
  );

}


function checkGoal(){

  if(
    !game.stageMode ||
    game.goalReached
  ){

    return;

  }


  const stage =
    stages[
      game.currentStage
    ];


  if(
    game.collectedKeys.length <
    stage.keys
  ){

    const remaining =
      stage.keys -
      game.collectedKeys.length;


    if(
      game.steps % 12 === 0
    ){

      showMessage(
        "🔒 ゴールは閉じている！ 残り鍵 " +
        remaining +
        "個"
      );

    }

    return;

  }


  const distance =
    distanceBetween(
      game.player.x,
      game.player.y,
      1200,
      120
    );


  if(distance <= 100){

    reachGoal();

  }

}

  game.goalReached = true;

/* =========================================================
   FIELD MOVE
========================================================= */

function move(direction){

  if(game.battle)
    return;


  if(!game.stageMode)
    return;


  if(game.goalReached)
    return;


  const speed = 12;


  if(direction === "up")
    game.player.y -= speed;

  if(direction === "down")
    game.player.y += speed;

  if(direction === "left")
    game.player.x -= speed;

  if(direction === "right")
    game.player.x += speed;


  game.player.x =
    Math.max(
      40,
      Math.min(
        2360,
        game.player.x
      )
    );


  game.player.y =
    Math.max(
      40,
      Math.min(
        1760,
        game.player.y
      )
    );


  updateCamera();


  player.animate(

    [

      {
        transform:
          "translate(-50%,-50%) translateY(0)"
      },

      {
        transform:
          "translate(-50%,-50%) translateY(-7px)"
      },

      {
        transform:
          "translate(-50%,-50%) translateY(0)"
      }

    ],

    {
      duration:150,
      easing:"ease-out"
    }

  );


  game.steps++;


  checkKeys();

  checkGoal();


  if(game.goalReached)
    return;


  /*
     ステージ2・3では
     四天王の兵士が低確率で出現
  */

  const stage =
    stages[
      game.currentStage
    ];


  if(
    stage &&
    stage.soldier &&
    game.steps >= 18 &&
    Math.random() < 0.035
  ){

    game.steps = 0;

    startSoldierBattle();

    return;

  }


  /*
     通常モンスター
  */

  if(
    game.steps >= 15 &&
    Math.random() < 0.06
  ){

    game.steps = 0;

    encounter();

  }

}

function startBattle(
  enemy,
  isBoss = false
){

  game.battle = true;

  game.currentTurn = 0;


  game.enemy.name =
    enemy.name;

  game.enemy.icon =
    enemy.icon;

  game.enemy.maxHp =
    enemy.hp;

  game.enemy.hp =
    enemy.hp;

  game.enemy.boss =
    isBoss;


  game.party.forEach(
    member => {

      member.defend = false;

    }
  );


  document.getElementById(
    "enemyIcon"
  ).textContent =
    game.enemy.icon;


  document.getElementById(
    "enemyNameBig"
  ).textContent =
    game.enemy.name;


  document.getElementById(
    "battleEnemyName"
  ).textContent =
    isBoss
      ? "👑 " + game.enemy.name
      : game.enemy.name;


  battleResult.style.display =
    "none";


  skillWindow.classList.remove(
    "show"
  );


  updateBattleUI();


  battleTransition.classList.remove(
    "active",
    "flash"
  );


  void battleTransition.offsetWidth;


  battleTransition.classList.add(
    "active",
    "flash"
  );


  viewport.classList.add(
    "battleShake"
  );


  setTimeout(
    () => {

      viewport.classList.remove(
        "battleShake"
      );


      battle.style.display =
        "block";


      battle.classList.remove(
        "show"
      );


      requestAnimationFrame(
        () => {

          battle.classList.add(
            "show"
          );

        }
      );

    },
    450
  );


  setTimeout(
    () => {

      battleTransition.classList.remove(
        "active"
      );

    },
    700
  );


  if(isBoss){

    setLog(
      "👑 " +
      game.enemy.name +
      "が立ちはだかった！"
    );

  }else{

    setLog(
      game.enemy.name +
      "が現れた！"
    );

  }


  updateTurnUI();

}

    "battleEnemyHP"

    game.enemy.maxHp;


  game.party.forEach(
    (member,index) => {

      const hpPercent =
        Math.max(
          0,
          member.hp /
          member.maxHp *
          100
        );


      const mpPercent =
        Math.max(
          0,
          member.mp /
          member.maxMp *
          100
        );


      document.getElementById(
        "hpBar" + index
      ).style.width =
        hpPercent + "%";


      document.getElementById(
        "mpBar" + index

        "mpText" + index

        member.maxMp;


      const card =
        document.getElementById(
          "party" + index
        );


      card.classList.toggle(
        "dead",

      );

  );

function useSkill(skill){

  if(!game.battle)
    return;


  if(game.currentTurn >= 3)
    return;


  const member =
    game.party[
      game.currentTurn
    ];


  if(!member)
    return;


  if(skill === "fire"){

    const cost = 10;


    if(member.mp < cost){

      setLog(
        "MPが足りない！"
      );

      return;

    }


    member.mp -= cost;


    const damage =
      18 +
      Math.floor(
        Math.random() * 10
      );


    game.enemy.hp -=
      damage;


    skillWindow.classList.remove(
      "show"
    );


    enemyHit();


    showDamage(
      damage
    );


    setLog(
      member.name +
      "はファイアを使った！"
    );

  }


  if(skill === "heal"){

    const cost = 12;


    if(member.mp < cost){

      setLog(
        "MPが足りない！"
      );

      return;

    }


    member.mp -= cost;


    const heal =
      25 +
      Math.floor(
        Math.random() * 10
      );


    member.hp =
      Math.min(
        member.maxHp,
        member.hp + heal
      );


    skillWindow.classList.remove(
      "show"
    );


    setLog(
      member.name +
      "はヒールを使った！ +" +
      heal +
      " HP"
    );

  }


  if(skill === "power"){

    const cost = 15;


    if(member.mp < cost){

      setLog(
        "MPが足りない！"
      );

      return;

    }


    member.mp -= cost;


    const damage =
      25 +
      Math.floor(
        Math.random() * 12
      );


    game.enemy.hp -=
      damage;


    skillWindow.classList.remove(
      "show"
    );


    enemyHit();


    showDamage(
      damage
    );


    setLog(
      member.name +
      "のパワーストライク！"
    );

  }


  game.enemy.hp =
    Math.max(
      0,
      game.enemy.hp
    );


  updateBattleUI();


  if(game.enemy.hp <= 0){

    setTimeout(
      victory,
      650
    );

    return;

  }


  setTimeout(
    nextTurn,
    700
  );

}

/* =========================================================
   NEXT TURN
========================================================= */

function nextTurn(){

  if(!game.battle)
    return;


  game.currentTurn++;


  if(game.currentTurn >= 3){

    enemyTurn();

    return;

  }


  while(
    game.currentTurn < 3 &&
    game.party[
      game.currentTurn
    ].hp <= 0
  ){

    game.currentTurn++;

  }


  if(game.currentTurn >= 3){

    enemyTurn();

    return;

  }


  updateBattleUI();

  updateTurnUI();

}


/* =========================================================
   ENEMY TURN
========================================================= */

function enemyTurn(){

  game.currentTurn = 3;

  updateTurnUI();


  const alive =
    game.party.filter(
      member =>
        member.hp > 0
    );


  if(alive.length === 0){

    defeat();

    return;

  }


  const target =
    alive[
      Math.floor(
        Math.random() *
        alive.length
      )
    ];


  setLog(
    game.enemy.name +
    "のこうげき！"
  );


  setTimeout(
    () => {

      let damage =
        game.enemy.boss
          ? 13 +
            Math.floor(
              Math.random() * 10
            )
          : 10 +
            Math.floor(
              Math.random() * 9
            );


      if(target.defend){

        damage =
          Math.floor(
            damage / 2
          );

        target.defend =
          false;

      }


      target.hp -=
        damage;


      target.hp =
        Math.max(
          0,
          target.hp
        );


      showDamage(
        damage,
        "party"
      );


      setLog(
        target.name +
        "は " +
        damage +
        " ダメージを受けた！"
      );


      updateBattleUI();


      if(
        game.party.every(
          member =>
            member.hp <= 0
        )
      ){

        setTimeout(
          defeat,
          650
        );

        return;

      }


      setTimeout(
        () => {

          game.currentTurn = 0;

          updateTurnUI();


          setLog(
            "そらまめの番！"
          );

        },
        700
      );

    },
    600
  );

}

      game.enemy.boss
    ){

      battleResult.style.display =
        "none";


      battle.classList.remove(
        "show"
      );


      setTimeout(
        () => {

          battle.style.display =
            "none";

          game.battle = false;

          game.currentTurn = 0;


          game.party.forEach(
            member => {

              member.defend = false;

            }
          );


          completeStage();

        },
        350
      );


      return;

    }


    closeBattleToField();

  }
);


/* =========================================================
   COMPLETE STAGE
========================================================= */

function completeStage(){

  const stageNumber =
    game.currentStage;

  const stage =
    stages[
      stageNumber
    ];


  if(
    !game.clearedStages.includes(
      stageNumber
    )
  ){

    game.clearedStages.push(
      stageNumber
    );

  }


  saveGame();

  updateStageSelect();


  document.getElementById(
    "goalResultIcon"
  ).textContent =
    stageNumber === 3
      ? "🌊"
      : "🌟";


  document.getElementById(
    "goalResultSub"
  ).textContent =
    "ステージ" +
    stageNumber +
    "「" +
    stage.name +
    "」クリア！";


  if(stageNumber < 3){

    document.getElementById(
      "goalResultText"
    ).innerHTML =
      "見事に突破した！<br>" +
      "次のステージが解放された！";

  }else{

    document.getElementById(
      "goalResultText"
    ).innerHTML =
      "エリア1の3ステージを<br>" +
      "すべて突破した！ 🎉";

  }


  goalResult.classList.add(
    "show"
  );

}

========================================================= */

)

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer;


function showMessage(text){

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  clearTimeout(
    messageTimer
  );


  messageTimer =
    setTimeout(
      () => {

        if(!game.stageMode){

          message.textContent =
            "🗺️ ステージを選択しよう！";

        }else{

          message.textContent =
            "👣 フィールドを探索しよう！";

        }

      },
      1800
    );

}


/* =========================================================
   MOBILE / SAFARI
========================================================= */

let lastTouch = 0;


document.addEventListener(
  "touchend",
  event => {

    const now =
      Date.now();


    if(
      now - lastTouch <
      350
    ){

      event.preventDefault();

    }


    lastTouch =
      now;

  },
  {
    passive:false
  }
);


document.addEventListener(
  "touchmove",
  event => {

    if(
      event.touches.length > 1
    ){

      event.preventDefault();

    }

  },
  {
    passive:false
  }
);


[
  "gesturestart",
  "gesturechange",
  "gestureend"
].forEach(
  type => {

    document.addEventListener(
      type,
      event =>
        event.preventDefault(),
      {
        passive:false
      }
    );

  }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  updateCamera
);


/* =========================================================
   START
========================================================= */

loadGame();

updateHUD();

updateStageSelect();

updateKeyCounter();

updateCamera();

updateBattleUI();

showStageSelect();

</script>
