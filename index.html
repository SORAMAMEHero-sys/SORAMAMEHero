<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>勇者そらまめ</title>

<style>

/* =====================================================
   基本
===================================================== */

*{
  box-sizing:border-box;

  -webkit-user-select:none;
  user-select:none;

  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;

  overflow:hidden;

  background:#172033;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  touch-action:none;
  overscroll-behavior:none;
}

/* ボタン */
button{
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;

  touch-action:manipulation;

  cursor:pointer;
}


/* =====================================================
   HUD
===================================================== */

#hud{

  position:fixed;

  z-index:1000;

  top:0;
  left:0;

  width:100%;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    8px
    12px;

  color:white;

  background:#101827;

  border-bottom:
    2px solid #4d6380;

  pointer-events:none;
}

#title{

  font-size:15px;

  font-weight:bold;
}

.stats{

  display:flex;

  gap:7px;
}

.stat{

  padding:
    6px
    9px;

  border-radius:10px;

  background:#202e46;

  border:
    1px solid #596d8d;

  font-size:13px;

  font-weight:bold;
}


/* =====================================================
   VIEWPORT
===================================================== */

#viewport{

  position:absolute;

  left:0;
  top:58px;

  width:100%;
  height:calc(100% - 58px);

  overflow:hidden;

  background:#376e37;

  touch-action:none;

  overscroll-behavior:none;
}


/* =====================================================
   WORLD
===================================================== */

#world{

  position:absolute;

  left:0;
  top:0;

  width:2400px;
  height:1800px;

  transform-origin:
    0 0;

  will-change:transform;

  background-color:#376e37;

  background-image:
    radial-gradient(
      rgba(255,255,255,.08)
      1px,
      transparent 1px
    );

  background-size:
    35px 35px;
}


/* =====================================================
   ROAD
===================================================== */

.road{

  position:absolute;

  background:#927247;

  border:
    6px solid #765a37;

  border-radius:35px;
}

.road.horizontal{

  left:-100px;
  top:760px;

  width:2600px;
  height:190px;
}

.road.vertical{

  left:1120px;
  top:-100px;

  width:190px;
  height:2000px;
}


/* =====================================================
   WATER
===================================================== */

.water{

  position:absolute;

  left:1450px;
  top:170px;

  width:650px;
  height:390px;

  background:#286f88;

  border:
    7px solid #1d5367;

  border-radius:50px;
}


/* =====================================================
   VILLAGE
===================================================== */

.village{

  position:absolute;

  left:220px;
  top:700px;

  width:300px;
  height:230px;

  background:#548d43;

  border:
    5px solid #3d6e34;

  border-radius:30px;
}


/* =====================================================
   TREES
===================================================== */

.tree{

  position:absolute;

  width:70px;
  height:70px;

  border-radius:50%;

  background:#28612f;

  border:
    8px solid #1c4824;

  box-shadow:
    inset
    0 0 0 5px
    #3d8140;
}

.tree::after{

  content:"";

  position:absolute;

  left:22px;
  top:58px;

  width:18px;
  height:32px;

  background:#704a2b;

  z-index:-1;
}

.t1{
  left:300px;
  top:260px;
}

.t2{
  left:700px;
  top:420px;
}

.t3{
  left:830px;
  top:1280px;
}

.t4{
  left:1660px;
  top:1040px;
}

.t5{
  left:2050px;
  top:1330px;
}

.t6{
  left:1900px;
  top:260px;
}


/* =====================================================
   ROCK
===================================================== */

.rock{

  position:absolute;

  width:60px;
  height:42px;

  border-radius:50%;

  background:#6b7279;

  border:
    4px solid #4d5359;
}

.r1{
  left:600px;
  top:1080px;
}

.r2{
  left:1500px;
  top:800px;
}

.r3{
  left:2050px;
  top:700px;
}


/* =====================================================
   STAGE
===================================================== */

.stage{

  position:absolute;

  z-index:20;

  width:140px;
  min-height:65px;

  padding:10px;

  border-radius:16px;

  background:#43251c;

  border:
    3px solid #aa694a;

  color:white;

  font-weight:bold;

  text-align:center;

  box-shadow:
    0 6px 15px
    rgba(0,0,0,.35);

  touch-action:manipulation;
}

.stage:active{

  transform:scale(.96);
}

.stage small{

  display:block;

  margin-top:4px;

  font-size:11px;

  opacity:.75;
}

#stage1{

  left:1350px;
  top:650px;
}


/* =====================================================
   PLAYER
===================================================== */

/*
  ★重要★

  プレイヤーは world の中に存在する。

  カメラ移動時に world が動くので、
  プレイヤーにカメラ座標を足さない。
*/

#player{

  position:absolute;

  z-index:100;

  width:80px;
  height:100px;

  left:1200px;
  top:900px;

  transform:
    translate(-50%,-50%);

  pointer-events:none;

  text-align:center;

  will-change:
    left,
    top,
    transform;
}

#hero{

  font-size:44px;

  line-height:50px;

  filter:
    drop-shadow(
      0 3px 2px
      rgba(0,0,0,.35)
    );
}

#playerName{

  display:block;

  width:max-content;

  margin:
    0 auto;

  padding:
    3px 9px;

  border-radius:10px;

  background:#111;

  color:white;

  font-size:12px;

  font-weight:bold;
}

#marker{

  margin-top:1px;

  font-size:20px;

  line-height:20px;
}


/* =====================================================
   MESSAGE
===================================================== */

#message{

  position:fixed;

  z-index:900;

  left:50%;
  top:70px;

  transform:
    translateX(-50%);

  width:max-content;
  max-width:90%;

  padding:
    7px 12px;

  border-radius:12px;

  background:
    rgba(15,40,20,.88);

  color:#d9ffd9;

  font-size:12px;

  pointer-events:none;

  text-align:center;
}


/* =====================================================
   CONTROLS
===================================================== */

#controls{

  position:fixed;

  z-index:950;

  left:15px;
  bottom:18px;

  width:175px;
  height:175px;

  touch-action:none;
}

.control{

  position:absolute;

  width:56px;
  height:56px;

  padding:0;

  border-radius:14px;

  border:
    2px solid #617895;

  background:#1d304d;

  color:white;

  font-size:24px;

  box-shadow:
    0 5px 10px
    rgba(0,0,0,.3);

  touch-action:none;

  -webkit-user-select:none;
  user-select:none;
}

.control:active{

  background:#3a587e;

  transform:scale(.93);
}

#up{

  left:59px;
  top:0;
}

#left{

  left:0;
  top:59px;
}

#right{

  right:0;
  top:59px;
}

#down{

  left:59px;
  bottom:0;
}


/* =====================================================
   WORLD BUTTON
===================================================== */

#worldButton{

  position:fixed;

  z-index:950;

  right:15px;
  bottom:85px;

  width:58px;
  height:58px;

  padding:0;

  border-radius:50%;

  border:
    2px solid #647b9c;

  background:#1d304d;

  color:white;

  font-size:22px;

  touch-action:none;
}


/* =====================================================
   BATTLE
===================================================== */

#battle{

  position:fixed;

  z-index:2000;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  background:
    rgba(4,7,14,0);

  opacity:0;

  transition:
    opacity .45s,
    background .45s;

  pointer-events:none;
}

#battle.show{

  opacity:1;

  background:
    rgba(4,7,14,.94);

  pointer-events:auto;
}

.battleBox{

  width:min(90%,430px);

  padding:25px;

  border-radius:20px;

  background:#18243a;

  border:
    2px solid #667b9c;

  color:white;

  text-align:center;

  box-shadow:
    0 10px 40px
    rgba(0,0,0,.5);

  transform:
    scale(.92);

  transition:
    transform .45s;
}

#battle.show .battleBox{

  transform:
    scale(1);
}

.enemy{

  font-size:75px;

  margin:10px;
}

.enemyName{

  font-size:18px;

  font-weight:bold;
}

.hp{

  height:18px;

  margin:12px 0;

  border-radius:10px;

  overflow:hidden;

  background:#3a1919;
}

.hpBar{

  width:100%;
  height:100%;

  background:#df4d4d;

  transition:
    width .25s;
}

.attack{

  width:100%;

  margin-top:15px;

  padding:13px;

  border:0;

  border-radius:12px;

  background:#cf6638;

  color:white;

  font-weight:bold;

  font-size:15px;

  touch-action:manipulation;
}

.attack:active{

  transform:scale(.97);
}


/* =====================================================
   ENEMY APPEAR EFFECT
===================================================== */

#battle.show .enemy{

  animation:
    enemyAppear
    .45s
    ease-out;
}

@keyframes enemyAppear{

  0%{

    opacity:0;

    transform:
      scale(.3)
      translateY(25px);
  }

  60%{

    opacity:1;

    transform:
      scale(1.08)
      translateY(-5px);
  }

  100%{

    opacity:1;

    transform:
      scale(1)
      translateY(0);
  }
}


/* =====================================================
   WORLD PANEL
===================================================== */

#worldPanel{

  position:fixed;

  z-index:1500;

  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  background:
    rgba(0,0,0,.7);
}

.panel{

  width:85%;
  max-width:350px;

  padding:22px;

  border-radius:18px;

  background:#17243a;

  border:
    2px solid #657b9c;

  color:white;

  text-align:center;
}

.panel h2{

  margin-top:0;
}

.panel button{

  width:100%;

  margin-top:10px;

  padding:12px;

  border:0;

  border-radius:10px;

  background:#304967;

  color:white;

  font-size:14px;
}

.close{

  background:#663b3b !important;
}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:700px){

  #viewport{

    width:700px;

    left:50%;

    transform:
      translateX(-50%);
  }

  #hud{

    width:700px;

    left:50%;

    transform:
      translateX(-50%);
  }
}

</style>
</head>


<body>


<!-- =====================================================
     HUD
===================================================== -->

<header id="hud">

  <div id="title">
    🌱 勇者そらまめ
  </div>

  <div class="stats">

    <div class="stat">
      Lv.<span id="level">1</span>
    </div>

    <div class="stat">
      💰 <span id="gold">0</span>
    </div>

  </div>

</header>


<!-- =====================================================
     VIEWPORT
===================================================== -->

<div id="viewport">


  <!-- ===================================================
       WORLD
  ==================================================== -->

  <div id="world">


    <!-- 道 -->

    <div class="road horizontal"></div>

    <div class="road vertical"></div>


    <!-- 水 -->

    <div class="water"></div>


    <!-- 村 -->

    <div class="village"></div>


    <!-- 木 -->

    <div class="tree t1"></div>
    <div class="tree t2"></div>
    <div class="tree t3"></div>
    <div class="tree t4"></div>
    <div class="tree t5"></div>
    <div class="tree t6"></div>


    <!-- 岩 -->

    <div class="rock r1"></div>
    <div class="rock r2"></div>
    <div class="rock r3"></div>


    <!-- ステージ -->

    <button
      class="stage"
      id="stage1">

      🚪 ステージ1

      <small>
        山道
      </small>

    </button>


    <!-- =================================================
         PLAYER

         ★ここが重要★

         left / top はワールド座標。

         カメラ座標はここでは計算しない。
    ================================================== -->

    <div id="player">

      <div id="hero">
        🧑‍🌾
      </div>

      <div id="playerName">
        そらまめ
      </div>

      <div id="marker">
        🌱
      </div>

    </div>


  </div>

</div>


<!-- =====================================================
     MESSAGE
===================================================== -->

<div id="message">
  👣 フィールドを探索しよう！
</div>


<!-- =====================================================
     CONTROLS
===================================================== -->

<div id="controls">

  <button
    class="control"
    id="up">
    ▲
  </button>

  <button
    class="control"
    id="left">
    ◀
  </button>

  <button
    class="control"
    id="right">
    ▶
  </button>

  <button
    class="control"
    id="down">
    ▼
  </button>

</div>


<!-- 世界移動 -->

<button id="worldButton">
  🌎
</button>


<!-- =====================================================
     BATTLE
===================================================== -->

<div id="battle">

  <div class="battleBox">

    <h2>
      ⚔️ 敵が現れた！
    </h2>

    <div
      class="enemy"
      id="enemyIcon">
      👾
    </div>

    <div
      class="enemyName"
      id="enemyName">
      スライム
    </div>

    <div class="hp">

      <div
        class="hpBar"
        id="enemyHPBar">
      </div>

    </div>

    <div>

      HP:
      <span id="enemyHPText">
        30 / 30
      </span>

    </div>

    <button
      class="attack"
      id="attackButton">

      ⚔️ こうげき

    </button>

  </div>

</div>


<!-- =====================================================
     WORLD MOVE
===================================================== -->

<div id="worldPanel">

  <div class="panel">

    <h2>
      🌎 世界移動
    </h2>

    <p>
      行き先を選択
    </p>

    <button id="surfaceSave">
      🌱 表世界・セーブポイント
    </button>

    <button id="underSave">
      🌑 裏世界・セーブポイント
    </button>

    <button
      class="close"
      id="closeWorld">

      閉じる

    </button>

  </div>

</div>


<script>

/* =====================================================
   GAME DATA
===================================================== */

const game = {

  level:1,

  gold:0,

  battle:false,

  steps:0,

  player:{

    /*
      ★完全なワールド座標★

      画面座標ではない。

      ここを変更すると
      プレイヤーがワールド内を移動する。
    */

    x:1200,

    y:900

  },

  camera:{

    x:0,

    y:0

  },

  enemy:{

    hp:30,

    maxHp:30

  }

};


/* =====================================================
   WORLD SIZE
===================================================== */

const WORLD_WIDTH = 2400;

const WORLD_HEIGHT = 1800;


/* =====================================================
   ELEMENT
===================================================== */

const viewport =
  document.getElementById(
    "viewport"
  );

const world =
  document.getElementById(
    "world"
  );

const player =
  document.getElementById(
    "player"
  );

const battle =
  document.getElementById(
    "battle"
  );

const message =
  document.getElementById(
    "message"
  );


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

  document.getElementById(
    "level"
  ).textContent =
    game.level;

  document.getElementById(
    "gold"
  ).textContent =
    game.gold;

}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

  const width =
    viewport.clientWidth;

  const height =
    viewport.clientHeight;


  /*
    プレイヤーを
    画面中央にする。

    camera = プレイヤーのワールド座標
              - 画面半分
  */

  let cameraX =
    game.player.x -
    width / 2;

  let cameraY =
    game.player.y -
    height / 2;


  /*
    マップ端で止める
  */

  cameraX =
    Math.max(
      0,
      Math.min(
        cameraX,
        WORLD_WIDTH - width
      )
    );


  cameraY =
    Math.max(
      0,
      Math.min(
        cameraY,
        WORLD_HEIGHT - height
      )
    );


  game.camera.x =
    cameraX;

  game.camera.y =
    cameraY;


  /*
    ★重要★

    ワールドだけを動かす。

    プレイヤーは world の中にいるため、
    player.style.left/top を
    画面座標に書き換えない。
  */

  world.style.transform =
    "translate(" +
    (-cameraX) +
    "px," +
    (-cameraY) +
    "px)";


  /*
    プレイヤーのワールド座標を
    そのままCSSへ反映。

    これでステージ・背景・プレイヤーが
    完全に同じ座標系になる。
  */

  player.style.left =
    game.player.x + "px";

  player.style.top =
    game.player.y + "px";

}


/* =====================================================
   MOVE
===================================================== */

function move(direction){

  if(game.battle)
    return;


  const speed = 12;


  if(direction === "up"){

    game.player.y -= speed;

  }


  if(direction === "down"){

    game.player.y += speed;

  }


  if(direction === "left"){

    game.player.x -= speed;

  }


  if(direction === "right"){

    game.player.x += speed;

  }


  /*
    マップ外へ出ない
  */

  game.player.x =
    Math.max(
      40,
      Math.min(
        WORLD_WIDTH - 40,
        game.player.x
      )
    );


  game.player.y =
    Math.max(
      50,
      Math.min(
        WORLD_HEIGHT - 50,
        game.player.y
      )
    );


  updateCamera();


  /*
    歩行アニメーション

    player自体のtransformを
    カメラ移動には使わない。
  */

  player.animate(

    [

      {
        transform:
          "translate(-50%,-50%)"
      },

      {
        transform:
          "translate(-50%,-57%)"
      },

      {
        transform:
          "translate(-50%,-50%)"
      }

    ],

    {

      duration:150,

      easing:"ease-out"

    }

  );


  game.steps++;


  /*
    エンカウント。

    以前よりかなり低くする。

    最低20歩。

    その後4%。
  */

  if(

    game.steps >= 20 &&

    Math.random() < 0.04

  ){

    game.steps = 0;

    encounter();

  }

}


/* =====================================================
   CONTROL
===================================================== */

function bindControl(
  id,
  direction
){

  const button =
    document.getElementById(id);


  /*
    pointerdown

    touch / mouse / stylus
    全部まとめて処理。
  */

  button.addEventListener(

    "pointerdown",

    event => {

      event.preventDefault();

      event.stopPropagation();


      /*
        他の操作と
        ポインターを奪い合わない。
      */

      if(
        button.setPointerCapture
      ){

        try{

          button.setPointerCapture(
            event.pointerId
          );

        }catch(e){}

      }


      move(direction);

    },

    {
      passive:false
    }

  );

}


bindControl(
  "up",
  "up"
);

bindControl(
  "down",
  "down"
);

bindControl(
  "left",
  "left"
);

bindControl(
  "right",
  "right"
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(

  "keydown",

  event => {

    const keys = {

      ArrowUp:"up",

      ArrowDown:"down",

      ArrowLeft:"left",

      ArrowRight:"right",

      w:"up",
      s:"down",
      a:"left",
      d:"right"

    };


    const direction =
      keys[event.key];


    if(direction){

      event.preventDefault();

      move(direction);

    }

  },

  {
    passive:false
  }

);


/* =====================================================
   ENCOUNTER
===================================================== */

function encounter(){

  if(game.battle)
    return;


  game.battle = true;


  const enemies = [

    {
      icon:"👾",
      name:"グリーンスライム",
      hp:30
    },

    {
      icon:"🐺",
      name:"ワイルドウルフ",
      hp:40
    },

    {
      icon:"🦇",
      name:"ダークバット",
      hp:35
    }

  ];


  const enemy =
    enemies[
      Math.floor(
        Math.random() *
        enemies.length
      )
    ];


  game.enemy.maxHp =
    enemy.hp;

  game.enemy.hp =
    enemy.hp;


  document.getElementById(
    "enemyIcon"
  ).textContent =
    enemy.icon;


  document.getElementById(
    "enemyName"
  ).textContent =
    enemy.name;


  updateEnemy();


  /*
    フィードイン開始
  */

  battle.style.display =
    "flex";


  requestAnimationFrame(() => {

    requestAnimationFrame(() => {

      battle.classList.add(
        "show"
      );

    });

  });

}


/* =====================================================
   ENEMY HP
===================================================== */

function updateEnemy(){

  const percent =

    Math.max(
      0,
      game.enemy.hp /
      game.enemy.maxHp *
      100
    );


  document.getElementById(
    "enemyHPBar"
  ).style.width =
    percent + "%";


  document.getElementById(
    "enemyHPText"
  ).textContent =

    game.enemy.hp +
    " / " +
    game.enemy.maxHp;

}


/* =====================================================
   ATTACK
===================================================== */

document.getElementById(
  "attackButton"
)
.addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();

    event.stopPropagation();


    if(!game.battle)
      return;


    const damage =

      8 +
      Math.floor(
        Math.random() * 9
      );


    game.enemy.hp -=
      damage;


    if(
      game.enemy.hp <= 0
    ){

      game.enemy.hp = 0;

      updateEnemy();


      setTimeout(() => {

        game.gold += 30;

        updateHUD();

        closeBattle();

        showMessage(
          "✨ 敵を倒した！ +30G"
        );

      },500);


      return;

    }


    updateEnemy();

  },

  {
    passive:false
  }

);


/* =====================================================
   CLOSE BATTLE
===================================================== */

function closeBattle(){

  battle.classList.remove(
    "show"
  );


  setTimeout(() => {

    battle.style.display =
      "none";

    game.battle = false;

  },450);

}


/* =====================================================
   STAGE
===================================================== */

document.getElementById(
  "stage1"
)
.addEventListener(

  "pointerdown",

  event => {

    event.preventDefault();

    event.stopPropagation();


    if(game.battle)
      return;


    /*
      ステージ戦闘
    */

    game.battle = true;


    game.enemy.maxHp =
      60;

    game.enemy.hp =
      60;


    document.getElementById(
      "enemyIcon"
    ).textContent =
      "👹";


    document.getElementById(
      "enemyName"
    ).textContent =
      "山道の魔物";


    updateEnemy();


    battle.style.display =
      "flex";


    requestAnimationFrame(() => {

      requestAnimationFrame(() => {

        battle.classList.add(
          "show"
        );

      });

    });

  },

  {
    passive:false
  }

);

)

/* =====================================================
   MESSAGE
===================================================== */

let messageTimer = null;


function showMessage(text){

  message.textContent =
    text;


  clearTimeout(
    messageTimer
  );


  messageTimer =
    setTimeout(() => {

      message.textContent =
        "👣 フィールドを探索しよう！";

    },1800);

}


/* =====================================================
   ZOOM BLOCK
===================================================== */

/*
  ダブルタップズーム防止
*/

let lastTouchTime = 0;


document.addEventListener(

  "touchend",

  event => {

    const now =
      Date.now();


    if(
      now - lastTouchTime <
      350
    ){

      event.preventDefault();

    }


    lastTouchTime =
      now;

  },

  {
    passive:false
  }

);


/*
  ピンチズーム防止
*/

document.addEventListener(

  "touchmove",

  event => {

    if(
      event.touches &&
      event.touches.length > 1
    ){

      event.preventDefault();

    }

  },

  {
    passive:false
  }

);


/*
  Safariジェスチャー防止
*/

[
  "gesturestart",
  "gesturechange",
  "gestureend"

].forEach(type => {

  document.addEventListener(

    type,

    event => {

      event.preventDefault();

    },

    {
      passive:false
    }

  );

});


/* =====================================================
   TOUCH SAFETY
===================================================== */

/*
  body上での長押し・選択を防止。
*/

document.addEventListener(

  "contextmenu",

  event => {

    event.preventDefault();

  }

);


/*
  スクロール防止
*/

document.addEventListener(

  "touchmove",

  event => {

    if(
      event.target.closest(
        "#viewport"
      ) ||
      event.target.closest(
        "#controls"
      )
    ){

      event.preventDefault();

    }

  },

  {
    passive:false
  }

);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(

  "resize",

  () => {

    updateCamera();

  }

);


/* =====================================================
   START
===================================================== */

updateHUD();

updateCamera();

showMessage(
  "👣 フィールドを探索しよう！"
);

</script>

</body>
</html>
